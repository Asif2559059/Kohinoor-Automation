/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
DATE
===================================================== */

function formatDate(value){

if(!value){
return "-";
}

const d = new Date(value);

if(isNaN(d.getTime())){
return "-";
}

return d.toLocaleString(
"bn-BD",
{
year:"numeric",
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit"
}
);

}


/* =====================================================
MONEY
===================================================== */

function formatMoney(value){

return Number(value || 0)
.toLocaleString(
"bn-BD",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}

ORDERS

function getProducts(order){

let products=order.products;

if(!products){
return [];
}

if(typeof products==="string"){

try{
products=JSON.parse(products);
}
catch(e){
return [];
}

}

return Array.isArray(products)
? products
: [];

}

error
} =
await supabaseClient
.from("orders")
.select("*")
.order(
"created_at",
{ascending:false}

status.textContent=
"কোনো অর্ডার পাওয়া যায়নি।";

}

orders.forEach(

status.innerHTML=
"❌ অর্ডার লোড করা যায়নি<br><br>"+

async function updateOrderStatus(

error
} =
await supabaseClient
.from("orders")
.update({
status:status,
updated_at:new Date().toISOString()
})
.eq("id",orderId);

if(error){

alert(
"Status পরিবর্তন করা যায়নি:\n\n"+
error.message
);

return;

}

alert("Status পরিবর্তন হয়েছে।");

loadOrders();

}

/* =====================================================
SEARCH
===================================================== */

function filterUsers(){

const keyword =
document.getElementById(
"userSearch"
).value
.toLowerCase()
.trim();

if(!keyword){

renderUsers(allUsers);

return;

}

const filtered =
allUsers.filter(user=>{

const username =
String(
user.username || ""
).toLowerCase();

const email =
String(
user.email || ""
).toLowerCase();

return (
username.includes(keyword) ||
email.includes(keyword)
);

});

renderUsers(filtered);

}


/* =====================================================
EDIT USERNAME
===================================================== */

async function editUsername(
userId,
oldUsername
){

const username =
prompt(
"নতুন Username দিন:",
oldUsername
);

if(username===null){
return;
}

const newUsername =
username.trim();

if(!newUsername){

alert("Username খালি রাখা যাবে না।");

return;

}

const {
error
} =
await supabaseClient
.from("profiles")
.update({
username:newUsername
})
.eq("id",userId);

if(error){

showUserMessage(
"Username পরিবর্তন করা যায়নি: "+
error.message,
"error"
);

return;

}

showUserMessage(
"Username সফলভাবে পরিবর্তন হয়েছে।",
"success"
);

loadUsers();

}

role:newRole
})
.eq("id",userId);

if(error){

showUserMessage(
"Role পরিবর্তন করা যায়নি: "+
error.message,
"error"
);

return;

}

showUserMessage(
"Role সফলভাবে পরিবর্তন হয়েছে।",
"success"
);

loadUsers();

}


/* =====================================================
ACTIVE / INACTIVE
===================================================== */

async function toggleUserStatus(
userId,
currentStatus
){

const newStatus =
currentStatus === "inactive"
? "active"
: "inactive";

const text =
newStatus === "active"
? "Active"
: "Inactive";

if(!confirm(
"User-কে "+text+" করতে চান?"
)){
return;
}

const {
error
} =
await supabaseClient
.from("profiles")
.update({
status:newStatus
})
.eq("id",userId);

if(error){

showUserMessage(
"Status পরিবর্তন করা যায়নি: "+
error.message,
"error"
);

return;

}

showUserMessage(
"User "+text+" করা হয়েছে।",
"success"
);

loadUsers();

}


/* =====================================================
DELETE USER
===================================================== */

async function deleteUser(
userId,
email
){

const ok =
confirm(
"এই User স্থায়ীভাবে Delete করতে চান?\n\n"+
"Email: "+email+
"\n\nএই কাজ Undo করা যাবে না।"
);

if(!ok){
return;
}


/*
   নিরাপদ Delete-এর জন্য Edge Function ব্যবহার করা হবে।
   এখানে Service Role Key ব্যবহার করা হয়নি।
*/

try{

const {
data:{
session
}
} =
await supabaseClient.auth.getSession();

if(!session){

alert("Admin login নেই।");

return;

}


/*
   Edge Function-এর নাম:
   delete-user
*/

const {
data,
error
} =
await supabaseClient.functions.invoke(
"delete-user",
{
body:{
user_id:userId
}
}
);

if(error){

throw error;

}

if(
data &&
data.success === false
){

throw new Error(
data.message ||
"User Delete করা যায়নি।"
);

}

showUserMessage(
"User সফলভাবে Delete হয়েছে।",
"success"
);

loadUsers();

}
catch(error){

console.error(error);

showUserMessage(
"User Delete করা যায়নি: "+
error.message,
"error"
);

}

}


/* =====================================================
USER MESSAGE
===================================================== */

function showUserMessage(
text,
type
){

const box =
document.getElementById(
"userMessage"
);

box.textContent=text;

box.className =
"message "+
(
type==="success"
? "success"
: "error"
);

box.style.display="block";

setTimeout(
()=>{
box.style.display="none";
},
4000
);

}


/* =====================================================
INITIALIZE
===================================================== */

async function initialize(){

const isAdmin =
await checkAdmin();

if(!isAdmin){
return;
}

showSection("orders");

await loadOrders();

await loadUsers();

}

initialize();

</script>
