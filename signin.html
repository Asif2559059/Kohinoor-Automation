<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Kohinoor Automation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0b6b45,#16a085);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
  text-align:center;
  color:#0b6b45;
  margin-bottom:25px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#0b6b45;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  text-align:center;
}

.error{
  background:#ffe5e5;
  color:#b00020;
}

.success{
  background:#e5f8ed;
  color:#087443;
}

.warning{
  background:#fff4d6;
  color:#8a6200;
}

.links{
  text-align:center;
  margin-top:20px;
}

.links a{
  color:#0b6b45;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

  <h2>🔐 Kohinoor Automation</h2>

  <label>ইমেইল</label>
  <input
    type="email"
    id="email"
    placeholder="আপনার ইমেইল"
  >

  <label>পাসওয়ার্ড</label>
  <input
    type="password"
    id="password"
    placeholder="পাসওয়ার্ড"
  >

  <button id="loginBtn" onclick="login()">
    লগইন
  </button>

  <div id="message" class="message"></div>

  <div class="links">
    <a href="signup.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://utzkpsohkoiawvuupgeb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";

const ADMIN_EMAIL =
  "mdyeamin10288@gmail.com";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";
}


async function login(){

  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;

  const btn =
    document.getElementById("loginBtn");

  if(!email || !password){

    showMessage(
      "ইমেইল ও পাসওয়ার্ড দিন।",
      "error"
    );

    return;
  }

  btn.disabled = true;

  btn.textContent = "যাচাই হচ্ছে...";

  document.getElementById("message")
    .style.display = "none";


  // =========================
  // LOGIN
  // =========================

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if(error){

    btn.disabled = false;

    btn.textContent = "লগইন";

    showMessage(
      "লগইন ব্যর্থ: " + error.message,
      "error"
    );

    return;
  }


  const user = data.user;


  // =========================
  // ADMIN CHECK
  // =========================

  if(
    user.email &&
    user.email.toLowerCase() ===
    ADMIN_EMAIL.toLowerCase()
  ){

    showMessage(
      "অ্যাডমিন হিসেবে লগইন সফল।",
      "success"
    );

    setTimeout(function(){

      window.location.href = "admin.html";

    },500);

    return;
  }


  // =========================
  // USER PROFILE CHECK
  // =========================

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("user_profiles")
      .select(
        "id, username, email, status, created_at"
      )
      .eq("id", user.id)
      .maybeSingle();


  console.log("PROFILE:", profile);
  console.log("PROFILE ERROR:", profileError);


  // Profile পাওয়া যায়নি
  if(profileError || !profile){

    await supabaseClient.auth.signOut();

    btn.disabled = false;

    btn.textContent = "লগইন";

    showMessage(
      "আপনার User Profile পাওয়া যায়নি। আবার Signup করুন।",
      "error"
    );

    return;
  }


  // =========================
  // PENDING
  // =========================

  if(profile.status === "pending"){

    await supabaseClient.auth.signOut();

    btn.disabled = false;

    btn.textContent = "লগইন";

    showMessage(
      "⏳ আপনার অ্যাকাউন্ট এখনো Admin Approval-এর অপেক্ষায় আছে। Approval না পাওয়া পর্যন্ত Dashboard-এ প্রবেশ করা যাবে না।",
      "warning"
    );

    return;
  }


  // =========================
  // REJECTED
  // =========================

  if(profile.status === "rejected"){

    await supabaseClient.auth.signOut();

    btn.disabled = false;

    btn.textContent = "লগইন";

    showMessage(
      "❌ আপনার অ্যাকাউন্ট Admin কর্তৃক Reject করা হয়েছে।",
      "error"
    );

    return;
  }


  // =========================
  // APPROVED
  // =========================

  if(profile.status === "approved"){

    localStorage.setItem(
      "kohinoor_user_profile",
      JSON.stringify(profile)
    );

    showMessage(
      "✅ Approval সফল। Dashboard-এ প্রবেশ করা হচ্ছে...",
      "success"
    );

    setTimeout(function(){

      window.location.href = "index.html";

    },500);

    return;
  }


  // =========================
  // UNKNOWN STATUS
  // =========================

  await supabaseClient.auth.signOut();

  btn.disabled = false;

  btn.textContent = "লগইন";

  showMessage(
    "আপনার Account Status সঠিক নয়।",
    "error"
  );

}

</script>

</body>
</html>
