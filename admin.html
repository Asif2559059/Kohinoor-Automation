<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f50">
<title>Kohinoor Admin</title>

<style>
body{
  margin:0;
  background:#f4f7f6;
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
  color:#26332e;
}

header{
  background:#087f50;
  color:#fff;
  padding:18px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:5px 0 0;
  font-size:15px;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
  background:#087f50;
  color:white;
  border:0;
  border-radius:8px;
  padding:11px 16px;
  font-size:16px;
  cursor:pointer;
}

button:active{
  opacity:.8;
}

#status{
  margin-top:12px;
  font-weight:bold;
}

.order{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border-left:5px solid #087f50;
}

.order h3{
  margin-top:0;
  color:#087f50;
}

.item{
  background:#f4f7f6;
  padding:8px;
  border-radius:6px;
  margin-top:6px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}
</style>
</head>

<body>

<header>
  <h1>কহিনুর কেমিক্যাল পিএলসি</h1>
  <p>অর্ডার অ্যাডমিন প্যানেল</p>
</header>

<main>

  <div class="card">
    <button onclick="loadOrders()">🔄 অর্ডার রিফ্রেশ করুন</button>
    <div id="status">অর্ডার লোড হচ্ছে...</div>
  </div>

  <div id="ordersBox"></div>

</main>

<script>

const SHEET_ID =
"1gM9f1Aze4Hp7bWvTngCnwBgZJRQD1dDhHocNNv7tDgI";

const SHEET_NAME = "Form Responses 1";

async function loadOrders(){

  const status = document.getElementById("status");
  const ordersBox = document.getElementById("ordersBox");

  status.textContent = "অর্ডার লোড হচ্ছে...";
  ordersBox.innerHTML = "";

  try{

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:json&sheet=" +
      encodeURIComponent(SHEET_NAME);

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("Google Sheet খোলা যাচ্ছে না");
    }

    const text = await response.text();

    const start = text.indexOf("{");
    const end = text.lastIndexOf("}");

    if(start === -1 || end === -1){
      throw new Error("Sheet data পাওয়া যায়নি");
    }

    const data = JSON.parse(text.substring(start,end+1));

    const rows = data.table.rows || [];

    if(rows.length === 0){
      status.textContent = "কোনো অর্ডার পাওয়া যায়নি।";
      ordersBox.innerHTML =
        '<div class="card empty">এখনও কোনো অর্ডার নেই।</div>';
      return;
    }

    status.textContent =
      rows.length + " টি অর্ডার পাওয়া গেছে";

    rows.reverse().forEach((row,index)=>{

      const c = row.c || [];

      function val(n){
        return c[n] && c[n].v != null
          ? c[n].v
          : "";
      }

      const timestamp = val(0);
      const shop      = val(1);
      const customer  = val(2);
      const mobile    = val(3);
      const address   = val(4);
      const product   = val(5);
      const quantity  = val(6);
      const note      = val(7);

      const div = document.createElement("div");
      div.className = "order";

      div.innerHTML = `
        <h3>অর্ডার #${rows.length - index}</h3>

        <b>তারিখ:</b> ${timestamp}<br>

        <b>দোকানের নাম:</b> ${shop}<br>

        <b>ক্রেতার নাম:</b> ${customer}<br>

        <b>মোবাইল:</b> ${mobile}<br>

        <b>ঠিকানা:</b> ${address}<br>

        <div class="item">
          <b>পণ্য:</b> ${product}<br>
          <b>পরিমাণ:</b> ${quantity}
        </div>

        ${
          note
          ? `<p><b>মন্তব্য:</b> ${note}</p>`
          : ""
        }
      `;

      ordersBox.appendChild(div);

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ অর্ডার লোড করা যায়নি";

    ordersBox.innerHTML = `
      <div class="card">
        <b>সমস্যা হয়েছে:</b><br>
        ${error.message}
      </div>
    `;
  }
}

loadOrders();

</script>

</body>
</html>
