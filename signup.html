<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>নতুন User Account - Kohinoor Automation</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b6b45, #16a085);
    }

    .signup-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      color: #0b6b45;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 22px;
      font-size: 15px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b6b45;
      box-shadow: 0 0 0 2px rgba(11,107,69,.10);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #0b6b45;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #095638;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: #146c3a;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #a12626;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: #0b6b45;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .hint {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="signup-box">

  <h2>🔐 নতুন User Account</h2>

  <p class="subtitle">
    Kohinoor Automation-এ আপনার Account তৈরি করুন
  </p>

  <form id="signupForm">

    <label for="username">
      User ID
    </label>

    <input
      type="text"
      id="username"
      placeholder="যেমন: asif123"
      autocomplete="username"
      minlength="3"
      maxlength="30"
      required
    >

    <div class="hint">
      ৩–৩০ অক্ষর | English অক্ষর, সংখ্যা, . _ - ব্যবহার করুন
    </div>


    <label for="email">
      Email
    </label>

    <input
      type="email"
      id="email"
      placeholder="আপনার Email"
      autocomplete="email"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="কমপক্ষে ৬ অক্ষর"
      autocomplete="new-password"
      minlength="6"
      required
    >


    <label for="confirmPassword">
      Confirm Password
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Password আবার লিখুন"
      autocomplete="new-password"
      minlength="6"
      required
    >


    <button
      type="submit"
      id="signupButton"
    >
      Sign Up
    </button>


    <div
      id="message"
      role="alert"
    ></div>

  </form>


  <div class="login-link">
    আগে থেকেই Account আছে?
    <a href="signin.html">
      Login করুন
    </a>
  </div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://utzkpsohkoiawvuupgeb.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";


/* =====================================================
   EMAIL REDIRECT URL
===================================================== */

const EMAIL_REDIRECT_URL =
  "https://asif2559059.github.io/Kohinoor-Automation/signin.html";


/* =====================================================
   SUPABASE CLIENT
===================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =====================================================
   ELEMENTS
===================================================== */

const form =
  document.getElementById("signupForm");

const usernameInput =
  document.getElementById("username");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const confirmPasswordInput =
  document.getElementById("confirmPassword");

const signupButton =
  document.getElementById("signupButton");

const message =
  document.getElementById("message");


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

  message.textContent = text;
  message.className = type;
  message.style.display = "block";

}


/* =====================================================
   HIDE MESSAGE
===================================================== */

function hideMessage() {

  message.textContent = "";
  message.className = "";
  message.style.display = "none";

}


/* =====================================================
   ERROR TRANSLATION
===================================================== */

function translateError(errorMessage) {

  const text =
    String(errorMessage || "").toLowerCase();


  if (
    text.includes("user already registered") ||
    text.includes("already registered")
  ) {
    return "এই Email দিয়ে আগে থেকেই Account আছে। Login করুন।";
  }


  if (
    text.includes("email rate limit") ||
    text.includes("rate limit")
  ) {
    return "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
  }


  if (
    text.includes("password should be at least") ||
    text.includes("password must be at least") ||
    text.includes("password should contain")
  ) {
    return "Password আরও শক্তিশালী দিন।";
  }


  if (
    text.includes("invalid email") ||
    text.includes("unable to validate email")
  ) {
    return "সঠিক Email Address দিন।";
  }


  if (text.includes("email not confirmed")) {
    return "আপনার Email এখনো Confirm করা হয়নি। Email Inbox চেক করুন।";
  }


  if (
    text.includes("row-level security") ||
    text.includes("permission denied")
  ) {
    return "Database Permission সমস্যার কারণে Account তৈরি করা যাচ্ছে না।";
  }


  if (
    text.includes("duplicate") ||
    text.includes("already exists")
  ) {
    return "এই তথ্য আগে থেকেই ব্যবহার করা হয়েছে।";
  }


  if (text.includes("network")) {
    return "Internet Connection পরীক্ষা করে আবার চেষ্টা করুন।";
  }


  return (
    errorMessage ||
    "Account তৈরি করা যায়নি। আবার চেষ্টা করুন।"
  );
}


/* =====================================================
   SIGNUP
===================================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    hideMessage();


    const username =
      usernameInput.value.trim();

    const email =
      emailInput.value.trim().toLowerCase();

    const password =
      passwordInput.value;

    const confirmPassword =
      confirmPasswordInput.value;


    /* =================================================
       USERNAME VALIDATION
    ================================================= */

    if (username.length < 3) {

      showMessage(
        "User ID কমপক্ষে ৩ অক্ষরের হতে হবে।",
        "error"
      );

      usernameInput.focus();

      return;
    }


    if (username.length > 30) {

      showMessage(
        "User ID সর্বোচ্চ ৩০ অক্ষরের হতে হবে।",
        "error"
      );

      usernameInput.focus();

      return;
    }


    if (!/^[a-zA-Z0-9._-]+$/.test(username)) {

      showMessage(
        "User ID-তে শুধু English অক্ষর, সংখ্যা, ., _ এবং - ব্যবহার করুন।",
        "error"
      );

      usernameInput.focus();

      return;
    }


    /* =================================================
       EMAIL
    ================================================= */

    if (!emailInput.checkValidity()) {

      showMessage(
        "সঠিক Email Address দিন।",
        "error"
      );

      emailInput.focus();

      return;
    }


    /* =================================================
       PASSWORD
    ================================================= */

    if (password.length < 6) {

      showMessage(
        "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
        "error"
      );

      passwordInput.focus();

      return;
    }


    /* =================================================
       CONFIRM PASSWORD
    ================================================= */

    if (password !== confirmPassword) {

      showMessage(
        "Password এবং Confirm Password মিলছে না।",
        "error"
      );

      confirmPasswordInput.focus();

      return;
    }


    /* =================================================
       LOADING
    ================================================= */

    signupButton.disabled = true;

    signupButton.textContent =
      "Account তৈরি হচ্ছে...";


    try {

      /* =================================================
         CHECK USERNAME
         
         IMPORTANT:
         এখানে profiles ব্যবহার হচ্ছে।
         user_profiles আর ব্যবহার করা হচ্ছে না।
      ================================================= */

      const {
        data: existingUser,
        error: usernameError
      } =
        await supabaseClient
          .from("profiles")
          .select("id")
          .eq("username", username)
          .maybeSingle();


      if (usernameError) {

        console.error(
          "Username Check Error:",
          usernameError
        );

        throw new Error(
          "User ID যাচাই করা যাচ্ছে না। Database Permission পরীক্ষা করুন।"
        );
      }


      /* =================================================
         USERNAME EXISTS
      ================================================= */

      if (existingUser) {

        showMessage(
          "এই User ID আগে থেকেই ব্যবহার করা হয়েছে। অন্য User ID দিন।",
          "error"
        );

        return;
      }


      /* =================================================
         CREATE AUTH USER
         
         Database Trigger automatically profile তৈরি করবে।
      ================================================= */

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo:
              EMAIL_REDIRECT_URL,

            data: {

              username: username,

              role: "user"

            }

          }

        });


      /* =================================================
         AUTH ERROR
      ================================================= */

      if (error) {

        console.error(
          "Supabase Auth Error:",
          error
        );

        throw error;
      }


      /* =================================================
         CHECK USER
      ================================================= */

      if (!data || !data.user) {

        throw new Error(
          "Supabase User তৈরি করতে পারেনি।"
        );
      }


      console.log(
        "New User ID:",
        data.user.id
      );


      /* =================================================
         SUCCESS
      ================================================= */

      showMessage(
        "✅ Account সফলভাবে তৈরি হয়েছে। আপনার Email Inbox থেকে Email Confirm করুন। এরপর Admin Approval-এর জন্য অপেক্ষা করুন।",
        "success"
      );


      /* =================================================
         RESET FORM
      ================================================= */

      form.reset();


      /* =================================================
         SIGN OUT IF SESSION EXISTS
      ================================================= */

      if (data.session) {

        await supabaseClient.auth.signOut();

      }

    } catch (error) {

      console.error(
        "SIGNUP ERROR:",
        error
      );

      showMessage(
        "❌ " +
        translateError(error.message),
        "error"
      );

    } finally {

      signupButton.disabled = false;

      signupButton.textContent =
        "Sign Up";

    }

  }
);

</script>

</body>
</html>
