<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f50">
<title>Kohinoor Admin</title>

<style>
body{
  margin:0;
  background:#f4f7f6;
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
  color:#26332e;
}

header{
  background:#087f50;
  color:#fff;
  padding:18px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:5px 0 0;
  font-size:15px;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px;
}

.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
  background:#087f50;
  color:white;
  border:0;
  border-radius:8px;
  padding:11px 16px;
  font-size:16px;
  cursor:pointer;
}

.call{
  display:inline-block;
  background:#1565c0;
  color:white;
  text-decoration:none;
  border-radius:8px;
  padding:9px 14px;
  margin-top:10px;
}

.print{
  background:#333;
  margin-top:10px;
  width:100%;
}

.status{
  margin-top:12px;
}

.status select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
  background:white;
}

.order{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border-left:5px solid #087f50;
}

.order h3{
  margin-top:0;
  color:#087f50;
}

.item{
  background:#f4f7f6;
  padding:10px;
  border-radius:7px;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

.small{
  color:#666;
  font-size:13px;
  margin-top:6px;
}
</style>
</head>

<body>

<header>
  <h1>কহিনুর কেমিক্যাল পিএলসি</h1>
  <button onclick="adminLogout()">🚪 Logout</button>
  <p>অর্ডার অ্যাডমিন প্যানেল</p>
</header>

<main>

  <div class="card">
    <button onclick="loadOrders()">🔄 অর্ডার রিফ্রেশ করুন</button>
    <div id="status">অর্ডার লোড হচ্ছে...</div>
  </div>

  <div id="ordersBox"></div>

</main>

<script>

const SHEET_ID =
"1gM9f1Aze4Hp7bWvTngCnwBgZJRQD1dDhHocNNv7tDgI";

const SHEET_NAME = "Form Responses 1";

const STATUS_KEY = "kohinoor_order_status";


function formatDate(value){

  if(!value) return "";

  let match = String(value).match(
    /Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/
  );

  if(match){

    const year = Number(match[1]);
    const month = Number(match[2]) + 1;
    const day = Number(match[3]);
    const hour = Number(match[4]);
    const minute = Number(match[5]);

    const dd = String(day).padStart(2,"0");
    const mm = String(month).padStart(2,"0");
    const hh = String(hour).padStart(2,"0");
    const min = String(minute).padStart(2,"0");

    return `${dd}/${mm}/${year} ${hh}:${min}`;
  }

  return value;
}


function getStatuses(){

  try{
    return JSON.parse(
      localStorage.getItem(STATUS_KEY) || "{}"
    );
  }catch(e){
    return {};
  }
}


function changeStatus(orderNumber,value){

  const statuses = getStatuses();

  statuses[orderNumber] = value;

  localStorage.setItem(
    STATUS_KEY,
    JSON.stringify(statuses)
  );
}


/* 🖨️ মেমো প্রিন্ট */
function printOrder(orderId){

  const order = document.getElementById(orderId);

  if(!order){
    alert("অর্ডার পাওয়া যায়নি");
    return;
  }

  const printWindow = window.open(
    "",
    "_blank",
    "width=800,height=900"
  );

  printWindow.document.write(`
<!doctype html>
<html lang="bn">

<head>
<meta charset="utf-8">

<title>অর্ডার মেমো</title>

<style>

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  padding:25px;
  color:#000;
}

.memo{
  max-width:700px;
  margin:auto;
}

.company{
  text-align:center;
  border-bottom:2px solid #000;
  padding-bottom:12px;
  margin-bottom:18px;
}

.company h1{
  margin:0;
  font-size:25px;
}

.company p{
  margin:5px 0;
}

h2{
  text-align:center;
  margin:15px 0;
}

.info{
  line-height:1.8;
}

.products{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.products th,
.products td{
  border:1px solid #000;
  padding:8px;
  text-align:left;
}

.total{
  margin-top:20px;
  text-align:right;
  font-size:18px;
  font-weight:bold;
}

.signature{
  display:flex;
  justify-content:space-between;
  margin-top:60px;
}

@media print{
  body{
    padding:0;
  }
}

</style>
</head>

<body>

<div class="memo">

  <div class="company">
    <h1>কহিনুর কেমিক্যাল পিএলসি</h1>
    <p>অর্ডার মেমো</p>
  </div>

  <h2>অর্ডার ${order.dataset.order}</h2>

  <div class="info">
    ${order.querySelector(".memoContent").innerHTML}
  </div>

  <div class="signature">
    <div>ক্রেতার স্বাক্ষর</div>
    <div>অনুমোদনকারী</div>
  </div>

</div>

<script>
window.onload=function(){
  window.print();
};
<\/script>

</body>
</html>
  `);

  printWindow.document.close();
}


async function loadOrders(){

  const status =
    document.getElementById("status");

  const ordersBox =
    document.getElementById("ordersBox");

  status.textContent =
    "অর্ডার লোড হচ্ছে...";

  ordersBox.innerHTML = "";

  try{

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:json&sheet=" +
      encodeURIComponent(SHEET_NAME);

    const response = await fetch(url);

    if(!response.ok){
      throw new Error(
        "Google Sheet খোলা যাচ্ছে না"
      );
    }

    const text =
      await response.text();

    const start =
      text.indexOf("{");

    const end =
      text.lastIndexOf("}");

    if(start === -1 || end === -1){
      throw new Error(
        "Sheet data পাওয়া যায়নি"
      );
    }

    const data =
      JSON.parse(
        text.substring(start,end+1)
      );

    const rows =
      data.table.rows || [];

    if(rows.length === 0){

      status.textContent =
        "কোনো অর্ডার পাওয়া যায়নি।";

      ordersBox.innerHTML =
        '<div class="card empty">এখনও কোনো অর্ডার নেই।</div>';

      return;
    }

    status.textContent =
      rows.length +
      " টি অর্ডার পাওয়া গেছে";

    const statuses =
      getStatuses();

    rows.reverse().forEach(
      (row,index)=>{

      const c = row.c || [];

      function val(n){
        return c[n] &&
          c[n].v != null
          ? c[n].v
          : "";
      }

      const timestamp = val(0);
      const shop      = val(1);
      const customer  = val(2);
      const mobile    = val(3);
      const address   = val(4);
      const product   = val(5);
      const quantity  = val(6);
      const note      = val(7);

      const orderNumber =
        rows.length - index;

      const currentStatus =
        statuses[orderNumber] ||
        "নতুন";

      const div =
        document.createElement("div");

      div.className = "order";

      div.id =
        "order_" + orderNumber;

      div.dataset.order =
        orderNumber;

      const safeMobile =
        String(mobile)
        .replace(/[^0-9+]/g,"");

      div.innerHTML = `

        <h3>অর্ডার #${orderNumber}</h3>

        <div class="memoContent">

          <b>তারিখ:</b>
          ${formatDate(timestamp)}
          <br>

          <b>দোকানের নাম:</b>
          ${shop}
          <br>

          <b>ক্রেতার নাম:</b>
          ${customer}
          <br>

          <b>মোবাইল:</b>
          ${mobile}
          <br>

          <b>ঠিকানা:</b>
          ${address}

          <div class="item">

            <b>পণ্য:</b>
            ${product}
            <br>

            <b>পরিমাণ:</b>
            ${quantity}

          </div>

          ${
            note
            ? `<p><b>মন্তব্য:</b> ${note}</p>`
            : ""
          }

        </div>

        ${
          safeMobile
          ? `<a class="call"
               href="tel:${safeMobile}">
               📞 সরাসরি কল করুন
             </a>`
          : ""
        }

        <div class="status">

          <b>অর্ডারের Status:</b>

          <select
            onchange="
              changeStatus(
                ${orderNumber},
                this.value
              )
            "
          >

            <option value="নতুন"
              ${currentStatus==="নতুন"
              ?"selected":""}>
              🆕 নতুন
            </option>

            <option value="প্রসেসিং"
              ${currentStatus==="প্রসেসিং"
              ?"selected":""}>
              🔄 প্রসেসিং
            </option>

            <option value="ডেলিভারি"
              ${currentStatus==="ডেলিভারি"
              ?"selected":""}>
              🚚 ডেলিভারি
            </option>

            <option value="সম্পন্ন"
              ${currentStatus==="সম্পন্ন"
              ?"selected":""}>
              ✅ সম্পন্ন
            </option>

          </select>

          <div class="small">
            Status এই Admin ফোনে সংরক্ষিত হবে।
          </div>

        </div>

        <button
          class="print"
          onclick="
            printOrder('order_${orderNumber}')
          "
        >
          🖨️ মেমো প্রিন্ট করুন
        </button>
      `;

      ordersBox.appendChild(div);

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "❌ অর্ডার লোড করা যায়নি";

    ordersBox.innerHTML = `
      <div class="card">
        <b>সমস্যা হয়েছে:</b><br>
        ${error.message}
      </div>
    `;
  }
}

loadOrders();

</script>

</body>
</html>
