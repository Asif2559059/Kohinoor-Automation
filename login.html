<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kohinoor Automation - Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
    }

    .signup-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      padding: 28px 24px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      color: #0b6b45;
    }

    .subtitle {
      margin: 0 0 22px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b6b45;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #0b6b45;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: #146c3a;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #a12626;
    }

    .login-link {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: #0b6b45;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h2>নতুন User Account</h2>

    <p class="subtitle">
      আপনার নতুন অ্যাকাউন্ট তৈরি করুন
    </p>

    <form id="signupForm">

      <!-- USERNAME -->

      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="আপনার Username লিখুন"
        autocomplete="username"
        minlength="3"
        maxlength="50"
        required
      >


      <!-- EMAIL -->

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="আপনার Email লিখুন"
        autocomplete="email"
        required
      >


      <!-- PASSWORD -->

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="কমপক্ষে ৬ অক্ষর"
        autocomplete="new-password"
        minlength="6"
        required
      >


      <!-- CONFIRM PASSWORD -->

      <label for="confirmPassword">Confirm Password</label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Password আবার লিখুন"
        autocomplete="new-password"
        minlength="6"
        required
      >


      <button
        type="submit"
        id="signupButton"
      >
        Sign Up
      </button>

      <div id="message"></div>

    </form>


    <div class="login-link">
      আগে থেকেই Account আছে?
      <a href="signin.html">Login করুন</a>
    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================

    const SUPABASE_URL =
      "https://utzkpsohkoiawvuupgeb.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";


    // ==========================================
    // EMAIL CONFIRMATION REDIRECT
    // ==========================================

    const EMAIL_REDIRECT_URL =
      "https://Asif2559059.github.io/Kohinoor-Automation/signin.html";


    // ==========================================
    // SUPABASE CLIENT
    // ==========================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==========================================
    // HTML ELEMENTS
    // ==========================================

    const form =
      document.getElementById("signupForm");

    const usernameInput =
      document.getElementById("username");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const signupButton =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className = type;

    }


    // ==========================================
    // ERROR TRANSLATION
    // ==========================================

    function translateError(errorMessage) {

      const text =
        String(errorMessage || "").toLowerCase();


      if (
        text.includes("user already registered")
      ) {
        return "এই Email দিয়ে আগে থেকেই Account আছে। Login করুন।";
      }


      if (
        text.includes("password should be at least")
      ) {
        return "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
      }


      if (
        text.includes("invalid email")
      ) {
        return "সঠিক Email address দিন।";
      }


      if (
        text.includes("email rate limit") ||
        text.includes("rate limit")
      ) {
        return "Email পাঠানোর সীমা অতিক্রম হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
      }


      if (
        text.includes("username") &&
        text.includes("duplicate")
      ) {
        return "এই Username আগে থেকেই ব্যবহার করা হয়েছে। অন্য Username দিন।";
      }


      if (
        text.includes("user_profiles_username_unique")
      ) {
        return "এই Username আগে থেকেই ব্যবহার করা হয়েছে। অন্য Username দিন।";
      }


      return "Sign Up করা যায়নি: " + errorMessage;
    }


    // ==========================================
    // SIGN UP
    // ==========================================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const username =
          usernameInput.value.trim();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        // ======================================
        // VALIDATION
        // ======================================

        if (!username) {

          showMessage(
            "Username দিন।",
            "error"
          );

          return;
        }


        if (username.length < 3) {

          showMessage(
            "Username কমপক্ষে ৩ অক্ষরের হতে হবে।",
            "error"
          );

          return;
        }


        if (!email) {

          showMessage(
            "Email দিন।",
            "error"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
            "error"
          );

          return;
        }


        if (password !== confirmPassword) {

          showMessage(
            "দুইটি Password একই নয়।",
            "error"
          );

          return;
        }


        // ======================================
        // BUTTON LOADING
        // ======================================

        signupButton.disabled = true;

        signupButton.textContent =
          "Account তৈরি হচ্ছে...";

        message.className = "";

        message.textContent = "";


        try {

          // ====================================
          // SUPABASE SIGN UP
          // ====================================

          const {
            data,
            error
          } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              emailRedirectTo:
                EMAIL_REDIRECT_URL,

              data: {

                username: username,

                role: "user"

              }

            }

          });


          // ====================================
          // ERROR
          // ====================================

          if (error) {

            console.error(
              "Signup Error:",
              error
            );

            showMessage(
              translateError(error.message),
              "error"
            );

            return;
          }


          // ====================================
          // USER CREATED
          // ====================================

          if (data.user) {

            /*
             * আমাদের Supabase trigger
             * automatically user_profiles table-এ
             * username + email + pending status
             * তৈরি করবে।
             */

            // ==================================
            // EMAIL CONFIRMATION REQUIRED
            // ==================================

            if (!data.session) {

              showMessage(

                "Account তৈরি হয়েছে। আপনার Email inbox-এ confirmation link পাঠানো হয়েছে। Email confirm করার পর Admin approval-এর জন্য অপেক্ষা করুন।",

                "success"

              );

              form.reset();

              return;
            }


            // ==================================
            // SESSION CREATED
            // ==================================

            /*
             * Email confirmation বন্ধ থাকলেও
             * account সরাসরি approved হবে না।
             *
             * user_profiles status থাকবে pending.
             */

            showMessage(

              "Account সফলভাবে তৈরি হয়েছে। Admin approval-এর জন্য অপেক্ষা করুন। Approval হলে Login করতে পারবেন।",

              "success"

            );

            form.reset();

            // নিরাপত্তার জন্য session sign out
            await supabaseClient.auth.signOut();

            return;
          }


          // ====================================
          // UNKNOWN RESULT
          // ====================================

          showMessage(
            "Account তৈরি করা যায়নি। আবার চেষ্টা করুন।",
            "error"
          );


        } catch (error) {

          console.error(
            "Signup Exception:",
            error
          );

          showMessage(

            "একটি অপ্রত্যাশিত সমস্যা হয়েছে: " +
            (error.message || error),

            "error"

          );

        } finally {

          signupButton.disabled = false;

          signupButton.textContent =
            "Sign Up";

        }

      }
    );

  </script>

</body>
</html>
