<title>Kohinoor Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f7f6;
  color:#26332e;
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
}

header{
  background:#087f50;
  color:#fff;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #0002;
}

header h1{

  font-size:23px;
}

header p{
  margin:5px 0;
}

  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:13px;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

nav button{
  background:#fff;
  color:#087f50;
}

main{
  max-width:1200px;
  margin:auto;
  padding:14px;
}

.card,
.user-card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #00000012;
}

h2,
h3{
  margin-top:0;
}

.hidden{
  display:none!important;
}

input,
select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  background:#fff;
}

.search{
  margin-bottom:12px;
}

.statusbox{
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
}

.success{
  background:#d4edda;
  color:#155724;
}

.error{
  background:#f8d7da;
  color:#721c24;
}

.loading{
  text-align:center;
  color:#666;
  padding:25px;
}

/* ================================
   ORDER TABLE
================================ */

.table-container{
  width:100%;
  overflow-x:auto;
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 8px #00000012;
  -webkit-overflow-scrolling:touch;
}

.order-table{
  width:100%;
  min-width:1050px;
  border-collapse:collapse;
}

.order-table th{
  background:#087f50;
  color:#fff;
  padding:13px 10px;
  text-align:left;
  white-space:nowrap;
  font-size:14px;
}

.order-table td{
  padding:11px 10px;
  border-bottom:1px solid #e3e3e3;
  vertical-align:middle;
  font-size:14px;
}

.order-table tbody tr:hover{
  background:#f4faf7;
}

.order-table tbody tr:last-child td{
  border-bottom:none;
}

.order-number{
  color:#087f50;
  font-weight:700;
}

.shop-name{
  font-weight:700;
}

.small-text{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.phone-link{
  color:#1565c0;
  text-decoration:none;
  white-space:nowrap;
}

.money{
  color:#087f50;
  font-weight:700;
  white-space:nowrap;
}

.action-buttons{
  display:flex;
  gap:5px;
  min-width:220px;
}

.action-buttons button{
  padding:7px 9px;
  font-size:12px;
  white-space:nowrap;
}

.view-btn{
  background:#087f50;
  color:#fff;
}

.print-btn{
  background:#333;
  color:#fff;
}

.delete-btn{
  background:#dc3545;
  color:#fff;
}

.status-select{
  min-width:125px;
  padding:8px;
  font-size:13px;
}

/* ================================
   ORDER DETAIL
================================ */

.order-detail{
  background:#fff;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 8px #00000012;
}

.detail-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  background:#f4f7f6;
  padding:12px;

  margin-bottom:15px;
}

.detail-info div{

.product-table-wrap{

  overflow-x:auto;
  margin-top:10px;

.product-table{
  width:100%;
  min-width:750px;
  border-collapse:collapse;
}

.product-table th{
  background:#087f50;
  color:#fff;
  padding:10px;
  text-align:left;
  white-space:nowrap;
}

.product-table td{

  border:1px solid #ddd;

.order-total{
  margin-top:12px;
  background:#e8f5ee;
  padding:12px;
  border-radius:8px;
  text-align:right;
  font-weight:bold;
  font-size:17px;
}

.note-box{

  padding:12px;
  background:#fff8e1;
  border-radius:8px;
}

/* ================================

================================ */

.user-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.user-actions{

  grid-template-columns:1fr 1fr;

  margin-top:12px;

.save{

  color:#fff;

.reject{
  background:#dc3545;
  color:#fff;

.badge{

  font-weight:700;
}

.approved{
  background:#d4edda;

.rejected{

  color:#721c24;

.inactive{

  background:#cfe8ff;

}

.completed{

<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://utzkpsohkoiawvuupgeb.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";

const ADMIN_EMAIL =
"mdyeamin10288@gmail.com";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   GLOBAL VARIABLES
========================================= */

let allUsers = [];

let allOrders = [];


/* =========================================
   ESCAPE HTML
========================================= */

function esc(v){

  if(v === null || v === undefined){
    return "";
  }

  return String(v)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   DATE
========================================= */

function dateText(v){

  if(!v){
    return "-";
  }

  const d = new Date(v);

  if(isNaN(d)){
    return esc(v);
  }

  return d.toLocaleString(
    "bn-BD",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================
   MONEY
========================================= */

function money(v){

  return Number(v || 0).toLocaleString(
    "bn-BD",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================================
   PRODUCTS
========================================= */

function productsOf(order){

  let p = order.products;

  if(!p){
    return [];
  }

  if(typeof p === "string"){

    try{

      p = JSON.parse(p);

    }catch(e){

      return [];

    }

  }

  return Array.isArray(p) ? p : [];

}


function getQty(p){

  return (
    p.quantity ??
    p.qty ??
    0
  );

}


function getPrice(p){

  return (
    p.price ??
    p.rate ??
    0
  );

}


function getSubtotal(p){

  const qty = getQty(p);

  const price = getPrice(p);

  return (
    p.subtotal ??
    p.total ??
    Number(qty) * Number(price)
  );

}


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin(){

  const {
    data:{
      session
    },
    error
  } =
  await supabaseClient.auth.getSession();


  if(error || !session){

    location.href = "login.html";

    return false;

  }


  if(
    (session.user.email || "").toLowerCase()
    !==
    ADMIN_EMAIL.toLowerCase()
  ){

    await supabaseClient.auth.signOut();

    alert(
      "শুধুমাত্র Admin Account ব্যবহার করতে পারবেন।"
    );

    location.href = "login.html";

    return false;

  }


  const {
    data,
    error:ae
  } =
  await supabaseClient
    .from("app_admins")
    .select("user_id")
    .eq("user_id",session.user.id)
    .maybeSingle();


  if(ae){

    alert(
      "Admin permission check error:\n\n" +
      ae.message
    );

    return false;

  }


  if(!data){

    await supabaseClient.auth.signOut();

    alert(
      "এই Account-এ Admin permission নেই।"
    );

    location.href = "login.html";

    return false;

  }


  document
    .getElementById("adminContent")
    .classList.remove("hidden");


  return true;

}


/* =========================================
   NAVIGATION
========================================= */

function showOrders(){

  document
    .getElementById("orderSection")
    .classList.remove("hidden");

  document
    .getElementById("userSection")
    .classList.add("hidden");

  loadOrders();

}


function showUsers(){

  document
    .getElementById("orderSection")
    .classList.add("hidden");

  document
    .getElementById("userSection")
    .classList.remove("hidden");

  loadUsers();

}


async function adminLogout(){

  await supabaseClient.auth.signOut();

  location.href = "login.html";

}


/* =========================================
   LOAD ORDERS
========================================= */

async function loadOrders(){

  const statusBox =
    document.getElementById("orderStatus");

  const ordersBox =
    document.getElementById("ordersBox");


  statusBox.className = "loading";

  statusBox.textContent =
    "Supabase থেকে অর্ডার লোড হচ্ছে...";


  ordersBox.innerHTML = "";


  const {
    data:orders,
    error
  } =
  await supabaseClient
    .from("orders")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    statusBox.className =
      "statusbox error";

    statusBox.textContent =
      "অর্ডার লোড করা যায়নি: " +
      error.message;

    return;

  }


  allOrders = orders || [];


  if(!allOrders.length){

    statusBox.className =
      "statusbox success";

    statusBox.textContent =
      "কোনো অর্ডার পাওয়া যায়নি।";

    return;

  }


  statusBox.className =
    "statusbox success";

  statusBox.textContent =
    "✅ " +
    allOrders.length +
    " টি অর্ডার পাওয়া গেছে";


  renderOrders();

}

pending
</option>

<option

processing
</option>

value="delivery"
${status==="delivery"?"selected":""}>
delivery
</option>

<option
value="completed"
${status==="completed"?"selected":""}>
completed
</option>

<option
value="rejected"
${status==="rejected"?"selected":""}>
rejected
</option>

</select>

</td>


<td>

    }

  box.innerHTML = `

<th>📞 মোবাইল</th>

<th>👤 প্রতিনিধি</th>

<th>💰 মোট</th>

<th>📌 Status</th>

<th>⚙️ Action</th>

</tr>

</thead>

`;

<select

style="margin-top:5px"

/* =========================================
   CLOSE MODAL
========================================= */

function closeOrderModal(){

  document
    .getElementById("orderModal")
    .classList.add("hidden");

}


document
  .getElementById("orderModal")
  .addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeOrderModal();

      }

    }
  );


/* =========================================
   UPDATE ORDER STATUS
========================================= */

async function updateOrderStatus(
  id,
  status
){

  const {
    error
  } =
  await supabaseClient
    .from("orders")
    .update({

      status:status,

      updated_at:
        new Date().toISOString()

    })
    .eq("id",id);


  if(error){

    alert(
      "Status পরিবর্তন করা যায়নি:\n\n" +
      error.message
    );

    return;

  }


  const order =
    allOrders.find(
      o =>
      String(o.id) === String(id)
    );


  if(order){

    order.status = status;

  }


  renderOrders();


  const modal =
    document.getElementById(
      "orderModal"
    );


  if(
    !modal.classList.contains("hidden")
  ){

    showOrderDetail(id);

  }


  alert(
    "Status পরিবর্তন হয়েছে।"
  );

}


/* =========================================
   DELETE ORDER
========================================= */

async function deleteOrder(id){

  if(
    !confirm(
      "এই অর্ডারটি Delete করতে চান?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("orders")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Delete করা যায়নি:\n\n" +
      error.message
    );

    return;

  }


  closeOrderModal();


  alert(
    "অর্ডার Delete হয়েছে।"
  );


  await loadOrders();

}

/* =========================================
   LOAD USERS
========================================= */

async function loadUsers(){

  const box =
    document.getElementById(
      "usersBox"
    );


  box.innerHTML =
    '<div class="loading">User লোড হচ্ছে...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .rpc("get_pending_users");


  if(error){

    box.innerHTML = `

<div class="card statusbox error">

User লোড করা যায়নি:

<br><br>

${esc(error.message)}

</div>

`;

    return;

  }


  allUsers =
    data || [];


  document
    .getElementById(
      "pendingCount"
    )
    .textContent =
      allUsers.filter(
        u =>
        u.status === "pending"
      ).length;


  renderUsers();

}


/* =========================================
   RENDER USERS
========================================= */

function renderUsers(){

  const input =
    document.getElementById(
      "userSearch"
    );


  const q =
    (input.value || "")
    .toLowerCase()
    .trim();


  const box =
    document.getElementById(
      "usersBox"
    );


  const users =
    allUsers.filter(
      u =>
      (u.username || "")
      .toLowerCase()
      .includes(q)
      ||
      (u.email || "")
      .toLowerCase()
      .includes(q)
    );


  if(!users.length){

    box.innerHTML =
      '<div class="card loading">কোনো User পাওয়া যায়নি।</div>';

    return;

  }


  box.innerHTML = "";


  users.forEach(
    u=>{

      const status =
        u.status || "pending";


      const role =
        u.role || "user";


      const div =
        document.createElement(
          "div"
        );


      div.className =
        "user-card";


      div.innerHTML = `

<h3>
👤 ${esc(u.username || "-")}
</h3>


<div class="muted">

${esc(u.email || "-")}

<br>

তৈরি:
${dateText(u.created_at)}

</div>


<div
class="user-grid"
style="margin-top:12px">


<div>

Username
</label>

id="name_${u.id}"
value="${esc(u.username || "")}"
>

</div>


<div>

id="role_${u.id}">

value="user"
${role==="user"?"selected":""}>

user

</option>

value="admin"

admin

</option>

</select>

</div>


<div>

<label>
Status
</label>

id="status_${u.id}">

value="pending"

</option>

</option>

/* =========================================
   SAVE USER
========================================= */

async function saveUser(id,btn){

  btn.disabled = true;


  const username =
    document
      .getElementById(
        "name_" + id
      )
      .value
      .trim();


  const role =
    document
      .getElementById(
        "role_" + id
      )
      .value;


  const status =
    document
      .getElementById(
        "status_" + id
      )
      .value;


  if(!username){

    showUserMessage(
      "Username খালি রাখা যাবে না।",
      "error"
    );

    btn.disabled = false;

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("profiles")
    .update({
      username,
      role,
      status
    })
    .eq("id",id);


  if(error){

    showUserMessage(
      "Update করা যায়নি: " +
      error.message,
      "error"
    );

    btn.disabled = false;

    return;

  }


  showUserMessage(
    "User তথ্য সফলভাবে Update হয়েছে।",
    "success"
  );


  await loadUsers();

}


/* =========================================
   QUICK REJECT
========================================= */

async function quickReject(id,btn){

  if(
    !confirm(
      "এই User-কে Reject করতে চান?"
    )
  ){

    return;

  }


  btn.disabled = true;


  const {
    error
  } =
  await supabaseClient
    .rpc(
      "reject_user",
      {
        target_user_id:id
      }
    );


  if(error){

    showUserMessage(
      "Reject করা যায়নি: " +
      error.message,
      "error"
    );

    btn.disabled = false;

    return;

  }


  showUserMessage(
    "User Rejected হয়েছে।",
    "success"
  );


  await loadUsers();

}


/* =========================================
   USER MESSAGE
========================================= */

function showUserMessage(
  text,
  type
){

  const b =
    document.getElementById(
      "userMessage"
    );


  b.textContent = text;


  b.className =
    "statusbox " +
    (
      type === "success"
      ?
      "success"
      :
      "error"
    );


  b.classList.remove(
    "hidden"
  );

}
