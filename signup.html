<script>
const SUPABASE_URL =
    "https://utzkpsohkoiawvuupgeb.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

document.getElementById("signupForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");


    // Username check
    if (!username) {
        message.textContent = "Username দিন";
        message.style.color = "red";
        return;
    }


    // Email check
    if (!email) {
        message.textContent = "Email দিন";
        message.style.color = "red";
        return;
    }


    // Password check
    if (password.length < 6) {
        message.textContent =
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে";
        message.style.color = "red";
        return;
    }


    // Confirm password
    if (password !== confirmPassword) {
        message.textContent =
            "দুইটি Password একই নয়";
        message.style.color = "red";
        return;
    }


    message.textContent =
        "Account তৈরি হচ্ছে...";
    message.style.color = "#0b6b45";


    // Username আগে আছে কিনা পরীক্ষা
    const { data: existingUser, error: checkError } =
        await supabaseClient
            .from("profiles")
            .select("id")
            .eq("username", username)
            .maybeSingle();


    if (checkError) {
        message.textContent =
            "Username পরীক্ষা করা যায়নি: " +
            checkError.message;
        message.style.color = "red";
        return;
    }


    if (existingUser) {
        message.textContent =
            "এই Username আগে থেকেই ব্যবহার করা হয়েছে";
        message.style.color = "red";
        return;
    }


    // Supabase Auth account তৈরি
    const { data: authData, error: authError } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    username: username
                }
            }

        });


    if (authError) {
        message.textContent =
            authError.message;
        message.style.color = "red";
        return;
    }


    if (!authData.user) {
        message.textContent =
            "Account তৈরি করা যায়নি";
        message.style.color = "red";
        return;
    }


    /*
      এখানে profiles.insert() নেই।

      Supabase Database Trigger
      নিজে থেকেই profiles table-এ
      username, email এবং role যোগ করবে।
    */


    message.textContent =
        "Account সফলভাবে তৈরি হয়েছে!";
    message.style.color = "#0b6b45";


    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);

});
</script>
