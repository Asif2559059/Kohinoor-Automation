<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>নতুন User Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
    }

    .signup-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 28px 24px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      color: #0b6b45;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 22px;
      font-size: 17px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b6b45;
      box-shadow: 0 0 0 2px rgba(11,107,69,0.08);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0b6b45;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: #146c3a;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #a12626;
    }

    .login-link {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: #0b6b45;
      font-weight: bold;
      text-decoration: none;
    }

    .hint {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h2>নতুন User Account</h2>

    <p class="subtitle">
      আপনার নতুন অ্যাকাউন্ট তৈরি করুন
    </p>

    <form id="signupForm">

      <!-- USER ID -->
      <label for="username">User ID</label>

      <input
        type="text"
        id="username"
        placeholder="আপনার User ID লিখুন"
        autocomplete="username"
        minlength="3"
        maxlength="30"
        required
      >

      <div class="hint">
        কমপক্ষে ৩ অক্ষর
      </div>


      <!-- EMAIL -->
      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="আপনার Email লিখুন"
        autocomplete="email"
        required
      >


      <!-- PASSWORD -->
      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="কমপক্ষে ৬ অক্ষর"
        autocomplete="new-password"
        minlength="6"
        required
      >


      <!-- CONFIRM PASSWORD -->
      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Password আবার লিখুন"
        autocomplete="new-password"
        minlength="6"
        required
      >


      <!-- SIGN UP -->
      <button type="submit" id="signupButton">
        Sign Up
      </button>

      <div id="message"></div>

    </form>


    <div class="login-link">
      আগে থেকেই Account আছে?
      <a href="signin.html">Login করুন</a>
    </div>

  </div>


  <script>

    /* =====================================================
       SUPABASE CONFIGURATION
       ===================================================== */

    const SUPABASE_URL =
      "https://utzkpsohkoiawvuupgeb.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";


    /* =====================================================
       SUPABASE CLIENT
       ===================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const form =
      document.getElementById("signupForm");

    const usernameInput =
      document.getElementById("username");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const signupButton =
      document.getElementById("signupButton");

    const message =
      document.getElementById("message");


    /* =====================================================
       MESSAGE
       ===================================================== */

    function showMessage(text, type) {

      message.textContent = text;
      message.className = type;

    }


    /* =====================================================
       ERROR TRANSLATION
       ===================================================== */

    function translateError(errorMessage) {

      const text =
        String(errorMessage || "").toLowerCase();


      if (
        text.includes("user already registered") ||
        text.includes("already registered")
      ) {
        return "এই Email দিয়ে আগে থেকেই Account আছে। Login করুন।";
      }


      if (
        text.includes("email rate limit") ||
        text.includes("rate limit")
      ) {
        return "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
      }


      if (
        text.includes("password should be at least")
      ) {
        return "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
      }


      if (
        text.includes("invalid email")
      ) {
        return "সঠিক Email Address দিন।";
      }


      if (
        text.includes("username") &&
        text.includes("duplicate")
      ) {
        return "এই User ID আগে থেকেই ব্যবহার করা হয়েছে। অন্য User ID দিন।";
      }


      return errorMessage || "Account তৈরি করা যায়নি। আবার চেষ্টা করুন।";
    }


    /* =====================================================
       SIGN UP
       ===================================================== */

    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const username =
        usernameInput.value.trim();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;


      /* USER ID VALIDATION */

      if (username.length < 3) {

        showMessage(
          "User ID কমপক্ষে ৩ অক্ষরের হতে হবে।",
          "error"
        );

        usernameInput.focus();

        return;
      }


      /* USER ID FORMAT */

      if (!/^[a-zA-Z0-9._-]+$/.test(username)) {

        showMessage(
          "User ID-তে শুধু English অক্ষর, সংখ্যা, ., _ এবং - ব্যবহার করুন।",
          "error"
        );

        usernameInput.focus();

        return;
      }


      /* PASSWORD */

      if (password.length < 6) {

        showMessage(
          "Password কমপক্ষে ৬ অক্ষরের হতে হবে।",
          "error"
        );

        passwordInput.focus();

        return;
      }


      /* CONFIRM PASSWORD */

      if (password !== confirmPassword) {

        showMessage(
          "Password এবং Confirm Password মিলছে না।",
          "error"
        );

        confirmPasswordInput.focus();

        return;
      }


      signupButton.disabled = true;
      signupButton.textContent = "Account তৈরি হচ্ছে...";


      try {

        /* =================================================
           CHECK USERNAME
           ================================================= */

        const {
          data: existingUser,
          error: usernameError
        } = await supabaseClient
          .from("user_profiles")
          .select("id")
          .ilike("username", username)
          .maybeSingle();


        if (usernameError) {

          console.error(usernameError);

          throw usernameError;

        }


        if (existingUser) {

          showMessage(
            "এই User ID আগে থেকেই ব্যবহার করা হয়েছে। অন্য User ID দিন।",
            "error"
          );

          signupButton.disabled = false;
          signupButton.textContent = "Sign Up";

          return;
        }


        /* =================================================
           CREATE AUTH USER
           ================================================= */

        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            emailRedirectTo:
              "https://asif2559059.github.io/Kohinoor-Automation/signin.html",

            data: {

              username: username,

              role: "user"

            }

          }

        });


        if (error) {

          throw error;

        }


        /* =================================================
           SUCCESS
           ================================================= */

        showMessage(
          "Account সফলভাবে তৈরি হয়েছে। আপনার Account Admin Approval-এর জন্য অপেক্ষা করছে।",
          "success"
        );


        form.reset();


        /* যদি session তৈরি হয় তাহলে logout */
        if (data && data.session) {

          await supabaseClient.auth.signOut();

        }


      } catch (error) {

        console.error("Signup error:", error);

        showMessage(
          translateError(error.message),
          "error"
        );

      }


      signupButton.disabled = false;
      signupButton.textContent = "Sign Up";

    });

  </script>

</body>
</html>
