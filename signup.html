<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>নতুন User Account</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
    }

    .signup-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 28px 24px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      color: #0b6b45;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #0b6b45;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0b6b45;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #e8f7ee;
      color: #146c3a;
    }

    .error {
      display: block !important;
      background: #fdecec;
      color: #a12626;
    }

    .login-link {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }

    .login-link a {
      color: #0b6b45;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <h2>নতুন User Account</h2>

    <p class="subtitle">
      আপনার নতুন অ্যাকাউন্ট তৈরি করুন
    </p>

    <form id="signupForm">

      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="আপনার Email লিখুন"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="কমপক্ষে ৬ অক্ষর"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Password আবার লিখুন"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <button type="submit" id="signupButton">
        Sign Up
      </button>

      <div id="message"></div>

    </form>

    <div class="login-link">
      আগে থেকেই Account আছে?
      <a href="login.html">Login করুন</a>
    </div>

  </div>
