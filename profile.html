<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমার প্রোফাইল - Kohinoor Automation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0b6b45,#16a085);
  min-height:100vh;
  padding:20px;
}

.container{
  max-width:500px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
  text-align:center;
  color:#0b6b45;
  margin:0 0 20px;
}

.avatar-area{
  text-align:center;
  margin-bottom:25px;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #0b6b45;
  background:#eee;
}

.photo-btn{
  display:inline-block;
  margin-top:12px;
  padding:10px 18px;
  background:#0b6b45;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

#photoInput{
  display:none;
}

label{
  display:block;
  margin-top:16px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#0b6b45;
}

.email{
  background:#f2f2f2;
}

.status{
  display:inline-block;
  padding:8px 16px;
  border-radius:20px;
  font-weight:bold;
}

.approved{
  background:#dff5e8;
  color:#087443;
}

.pending{
  background:#fff1c7;
  color:#8a6200;
}

.rejected{
  background:#ffe0e0;
  color:#b00020;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:#0b6b45;
  color:white;
}

.dashboard{
  background:#eeeeee;
  color:#222;
}

.logout{
  background:#ffe1e1;
  color:#b00020;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  text-align:center;
  font-weight:bold;
}

.success{
  background:#dff5e8;
  color:#087443;
}

.error{
  background:#ffe0e0;
  color:#b00020;
}

.loading{
  text-align:center;
  padding:30px;
  color:#666;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div id="loading" class="loading">
  প্রোফাইল লোড হচ্ছে...
</div>


<div id="profileArea" style="display:none;">

<h2>👤 আমার প্রোফাইল</h2>


<div class="avatar-area">

  <img
    id="avatar"
    class="avatar"
    src=""
    alt="Profile Picture"
  >

  <br>

  <label
    for="photoInput"
    class="photo-btn"
  >
    📷 ছবি পরিবর্তন
  </label>

  <input
    type="file"
    id="photoInput"
    accept="image/*"
  >

</div>


<label>
  Username
</label>

<input
  type="text"
  id="username"
  placeholder="Username লিখুন"
>


<label>
  Email
</label>

<input
  type="email"
  id="email"
  class="email"
  readonly
>


<label>
  Account Status
</label>

<div>
  <span
    id="status"
    class="status"
  ></span>
</div>


<button
  class="save"
  id="saveBtn"
  onclick="saveProfile()"
>
  💾 Profile Save
</button>


<button
  class="dashboard"
  onclick="goDashboard()"
>
  🏠 Dashboard
</button>


<button
  class="logout"
  onclick="logout()"
>
  🚪 Logout
</button>


<div
  id="message"
  class="message"
></div>

</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://utzkpsohkoiawvuupgeb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PJj7uWb3pd3VQvSI0jNyA_xY3CFKAt";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentProfile = null;
let selectedFile = null;


/* =========================
   PROFILE LOAD
========================= */

async function loadProfile(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();


    if(error || !data.user){

      window.location.replace(
        "signin.html"
      );

      return;
    }


    currentUser =
      data.user;


    const {
      data:profile,
      error:profileError
    } =
    await supabaseClient
      .from("user_profiles")
      .select("*")
      .eq(
        "id",
        currentUser.id
      )
      .single();


    console.log(
      "PROFILE:",
      profile
    );


    console.log(
      "PROFILE ERROR:",
      profileError
    );


    if(profileError){

      document.getElementById(
        "loading"
      ).textContent =
      "Profile Load Error: " +
      profileError.message;

      return;
    }


    if(!profile){

      document.getElementById(
        "loading"
      ).textContent =
      "User Profile পাওয়া যায়নি।";

      return;
    }


    currentProfile =
      profile;


    /* Username */

    document.getElementById(
      "username"
    ).value =
      profile.username || "";


    /* Email */

    document.getElementById(
      "email"
    ).value =
      profile.email ||
      currentUser.email ||
      "";


    /* Status */

    const statusElement =
      document.getElementById(
        "status"
      );


    statusElement.textContent =
      profile.status ||
      "unknown";


    statusElement.className =
      "status " +
      (profile.status || "");


    /* Profile Picture */

    const avatar =
      document.getElementById(
        "avatar"
      );


    if(profile.avatar_url){

      avatar.src =
        profile.avatar_url;

    }else{

      avatar.src =
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(
          profile.username || "User"
        ) +
        "&size=300";

    }


    /* Local Storage */

    localStorage.setItem(
      "kohinoor_user_profile",
      JSON.stringify(profile)
    );


    /* Show Profile */

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "profileArea"
    ).style.display =
      "block";


  }catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );


    document.getElementById(
      "loading"
    ).textContent =
      "Error: " +
      error.message;
  }

}


/* =========================
   PHOTO SELECT
========================= */

document.getElementById(
  "photoInput"
).addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){
      return;
    }


    if(!file.type.startsWith("image/")){

      showMessage(
        "শুধু ছবি নির্বাচন করুন।",
        "error"
      );

      this.value = "";

      return;
    }


    if(file.size > 5 * 1024 * 1024){

      showMessage(
        "ছবির সর্বোচ্চ Size 5 MB।",
        "error"
      );

      this.value = "";

      return;
    }


    selectedFile =
      file;


    /* Preview */

    const reader =
      new FileReader();


    reader.onload =
      function(event){

        document.getElementById(
          "avatar"
        ).src =
          event.target.result;

      };


    reader.readAsDataURL(file);

  }
);


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile(){

  if(!currentUser){

    return;
  }


  const username =
    document.getElementById(
      "username"
    ).value.trim();


  if(!username){

    showMessage(
      "Username লিখুন।",
      "error"
    );

    return;
  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;

  saveBtn.textContent =
    "⏳ Saving...";


  try{

    let avatarUrl =
      currentProfile.avatar_url ||
      null;


    /* =====================
       PHOTO UPLOAD
    ===================== */

    if(selectedFile){

      const extension =
        selectedFile.name
          .split(".")
          .pop()
          .toLowerCase();


      const filePath =
        currentUser.id +
        "/profile." +
        extension;


      const {
        error:uploadError
      } =
      await supabaseClient.storage
        .from("avatars")
        .upload(
          filePath,
          selectedFile,
          {
            upsert:true,
            contentType:
              selectedFile.type
          }
        );


      if(uploadError){

        throw uploadError;
      }


      const {
        data:publicData
      } =
      supabaseClient.storage
        .from("avatars")
        .getPublicUrl(
          filePath
        );


      avatarUrl =
        publicData.publicUrl +
        "?v=" +
        Date.now();
    }


    /* =====================
       DATABASE UPDATE
    ===================== */

    const {
      data:updatedProfile,
      error:updateError
    } =
    await supabaseClient
      .from("user_profiles")
      .update({

        username:
          username,

        avatar_url:
          avatarUrl,

        updated_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        currentUser.id
      )
      .select("*")
      .single();


    if(updateError){

      throw updateError;
    }


    currentProfile =
      updatedProfile;


    /* Local Storage Update */

    localStorage.setItem(
      "kohinoor_user_profile",
      JSON.stringify(
        updatedProfile
      )
    );


    selectedFile =
      null;


    showMessage(
      "✅ Profile সফলভাবে Update হয়েছে।",
      "success"
    );


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    showMessage(
      "❌ Update হয়নি: " +
      error.message,
      "error"
    );

  }


  saveBtn.disabled =
    false;

  saveBtn.textContent =
    "💾 Profile Save";
}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;


  message.style.display =
    "block";
}


/* =========================
   DASHBOARD
========================= */

function goDashboard(){

  window.location.href =
    "index.html";
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient
    .auth
    .signOut();


  localStorage.removeItem(
    "kohinoor_user_profile"
  );


  window.location.replace(
    "signin.html"
  );
}


/* =========================
   START
========================= */

loadProfile();

</script>

</body>
</html>
