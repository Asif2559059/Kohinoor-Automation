<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f50">
<title>Kohinoor Admin</title>

<style>
body{
  margin:0;
  background:#f4f7f6;
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
  color:#26332e;
}
header{
  background:#087f50;
  color:#fff;
  padding:18px;
}
header h1{
  margin:0;
  font-size:28px;
}
header p{
  margin:5px 0 0;
  font-size:18px;
}
main{
  max-width:760px;
  margin:auto;
  padding:14px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin:12px 0;
  box-shadow:0 2px 10px #0001;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}
button{
  background:#087f50;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:13px 20px;
  font-size:17px;
  font-weight:bold;
  margin-top:8px;
}
#status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#f0f0f0;
}
.order{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin:12px 0;
}
.item{
  background:#f5f7f6;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <h1>কহিনুর কেমিক্যাল পিএলসি</h1>
  <p>Admin — Online Orders</p>
</header>

<main>

<div class="card">
  <h2>Supabase সংযোগ</h2>

  <input
    id="supabaseUrl"
    placeholder="Supabase Project URL"
    value="https://utzkpsohkoiawvuupgeb.supabase.co">

  <input
    id="supabaseKey"
    type="password"
    placeholder="Supabase Publishable Key">

  <button id="loadBtn">অর্ডার লোড করুন</button>

  <div id="status">প্রস্তুত</div>
</div>

<div id="orders"></div>

</main>

<script>
document.getElementById("loadBtn").addEventListener("click", async function(){

  const url = document.getElementById("supabaseUrl").value.trim();
  const key = document.getElementById("supabaseKey").value.trim();
  const status = document.getElementById("status");
  const ordersBox = document.getElementById("orders");

  ordersBox.innerHTML = "";

  if(!url){
    status.textContent = "Supabase URL দিন";
    return;
  }

  if(!key){
    status.textContent = "Publishable Key দিন";
    return;
  }

  status.textContent = "অর্ডার লোড হচ্ছে...";

  try{

    const api =
      url.replace(/\/+$/,"") +
      "/rest/v1/Orders?select=*,order_items(*,products(*))&order=created_at.desc";

    const response = await fetch(api,{
      method:"GET",
      headers:{
        "apikey":key,
        "Authorization":"Bearer "+key
      }
    });

    const text = await response.text();

    if(!response.ok){
      throw new Error(text || ("HTTP "+response.status));
    }

    const data = JSON.parse(text);

    if(!Array.isArray(data) || data.length === 0){
      status.textContent = "কোনো অর্ডার পাওয়া যায়নি।";
      return;
    }

    status.textContent = data.length + "টি অর্ডার পাওয়া গেছে।";

    data.forEach(order => {

      const div = document.createElement("div");
      div.className = "order";

      let html =
        "<b>Order ID:</b> " + (order.id ?? "") + "<br>" +
        "<b>Shop:</b> " + (order.Shop_Name ?? "") + "<br>" +
        "<b>Mobile:</b> " + (order.Mobile ?? "") + "<br>" +
        "<b>Total:</b> ৳" + (order.total ?? 0) + "<br>" +
        "<b>Status:</b> " + (order.status ?? "") + "<br>";

      if(Array.isArray(order.order_items) &&
         order.order_items.length){

        html += "<h3>Products</h3>";

        order.order_items.forEach(item => {

          const product = item.products || {};

          html +=
            '<div class="item">' +
            (product.name || "Product") +
            " — Qty: " +
            (item.quantity || 1) +
            " — ৳" +
            (item.unit_price || product.price || 0) +
            "</div>";
        });
      }

      div.innerHTML = html;
      ordersBox.appendChild(div);
    });

  }catch(error){

    console.error(error);

    status.textContent =
      "সমস্যা: " + error.message;
  }

});
</script>

</body>
</html>
