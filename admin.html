// =====================================================
// AUTH / ADMIN CHECK

async function checkAdmin(){

  try{

    const {
      data:{
        session
      },
      error
    } =
    await supabaseClient.auth.getSession();


    if(error){

      console.error(error);

      alert(

    }

      return false;
    }


    const email =
    session.user.email || "";


    if(
      email.toLowerCase() !==

    ){

      await supabaseClient.auth.signOut();

      alert(

      );

    // ===============================================

// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// =====================================================
// DATE
// =====================================================

function formatDate(value){

  if(!value){
    return "-";
  }

  try{

    const date =
    new Date(value);

    if(
      isNaN(
        date.getTime()
      )
    ){

      return escapeHtml(
        value
      );

    }

    return date.toLocaleString(
      "bn-BD",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }
  catch(e){

    return escapeHtml(
      value
    );

  }

}


// =====================================================
// NUMBER
// =====================================================

function formatMoney(value){

  const number =
  Number(value || 0);

  return number.toLocaleString(
    "bn-BD",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


// =====================================================
// PRODUCT DATA NORMALIZER
// =====================================================

function getProductArray(order){

  let products =
  order.products;


  if(!products){

    return [];

  }


  if(
    typeof products ===
    "string"
  ){

    try{

      products =
      JSON.parse(
        products
      );

    }
    catch(e){

      return [];

    }

  }


  if(
    Array.isArray(products)
  ){

    return products;

  }


  return [];

}


// =====================================================
// ORDER STATUS
// =====================================================

function statusText(status){

  switch(status){

    case "processing":
      return "🔄 প্রসেসিং";

    case "delivery":
      return "🚚 ডেলিভারি";

    case "completed":
      return "✅ সম্পন্ন";

    case "rejected":
      return "❌ বাতিল";

    default:
      return "🆕 নতুন";

  }

}


function statusClass(status){

  switch(status){

    case "processing":
      return "badge-processing";

    case "delivery":
      return "badge-delivery";

    case "completed":
      return "badge-completed";

    default:
      return "badge-pending";

  }

}


// =====================================================
// LOAD ORDERS FROM SUPABASE
// =====================================================

async function loadOrders(){

  const statusBox =
  document.getElementById(
    "status"
  );

  const ordersBox =
  document.getElementById(
    "ordersBox"
  );


  statusBox.className =
  "loading";

  statusBox.textContent =
  "Supabase থেকে অর্ডার লোড হচ্ছে...";


  ordersBox.innerHTML =
  "";


  try{

    // ===============================================
    // ADMIN USER
    // ===============================================

    const {
      data:{
        user
      },
      error:userError
    } =
    await supabaseClient.auth.getUser();


    if(userError){

      throw userError;

    }


    if(!user){

      window.location.href =
      "login.html";

      return;

    }


    // ===============================================
    // SUPABASE ORDERS
    // ===============================================

    const {
      data:orders,
      error
    } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


    if(error){

      throw error;

    }


    const orderList =
    orders || [];


    if(
      orderList.length === 0
    ){

      statusBox.textContent =
      "কোনো অর্ডার পাওয়া যায়নি।";

      ordersBox.innerHTML = `

        <div class="card empty">

          <div style="font-size:45px;">
            📦
          </div>

          <h3>
            এখনো কোনো অর্ডার নেই
          </h3>

          <p>
            User পেজ থেকে নতুন অর্ডার দিলে
            এখানে দেখা যাবে।
          </p>

        </div>

      `;

      return;

    }


    statusBox.className =
    "success";

    statusBox.textContent =
    "✅ " +
    orderList.length +
    " টি অর্ডার পাওয়া গেছে";


    orderList.forEach(
      (
        order,
        index
      ) => {

        renderOrder(
          order,
          index
        );

      }
    );

  }
  catch(error){

    console.error(
      "LOAD ORDERS ERROR:",
      error
    );


    statusBox.className =
    "error";

    statusBox.innerHTML = `

      <b>
        ❌ অর্ডার লোড করা যায়নি
      </b>

      <br><br>

      ${escapeHtml(
        error.message
      )}

      <br><br>

      <small>
        Supabase Table/RLS Policy পরীক্ষা করুন।
      </small>

    `;

  }

}


// =====================================================
// RENDER ORDER
// =====================================================

function renderOrder(
  order,
  index
){

  const ordersBox =
  document.getElementById(
    "ordersBox"
  );


  const orderId =
  order.id;


  const products =
  getProductArray(
    order
  );


  const currentStatus =
  order.status ||
  "pending";


  let productHtml =
  "";


  if(
    products.length === 0
  ){

    productHtml = `

      <div class="item">
        কোনো পণ্যের তথ্য পাওয়া যায়নি।
      </div>

    `;

  }
  else{

    products.forEach(
      (
        product,
        productIndex
      ) => {

        const name =
        product.name ||
        product.product_name ||
        "-";


        const pack =
        product.pack ||
        product.unit ||
        "";


        const quantity =
        product.quantity ||
        product.qty ||
        0;


        const price =
        product.price ||
        0;


        const subtotal =
        product.subtotal ??
        product.total ??
        (
          Number(quantity) *
          Number(price)
        );


        productHtml += `

          <div class="item">

            <b>
              ${escapeHtml(name)}
            </b>

            ${
              pack
              ?
              `
              <br>
              প্যাক:
              ${escapeHtml(pack)}
              `
              :
              ""
            }

            <br>

            পরিমাণ:
            <b>
              ${escapeHtml(quantity)}
            </b>

            ${
              price
              ?
              `
              <br>
              মূল্য:
              ৳${formatMoney(price)}
              `
              :
              ""
            }

            <br>

            মোট:
            <b>
              ৳${formatMoney(subtotal)}
            </b>

          </div>

        `;

      }
    );

  }


  const safeMobile =
  String(
    order.mobile ||
    ""
  )
  .replace(
    /[^0-9+]/g,
    ""
  );


  const orderNumber =
  index + 1;


  const div =
  document.createElement(
    "div"
  );


  div.className =
  "order";


  div.id =
  "order_" +
  escapeHtml(
    String(orderId)
  );


  div.innerHTML = `

    <h3>
      📦 অর্ডার #${orderNumber}
    </h3>


    <div class="info">

      <b>
        অর্ডার ID:
      </b>

      ${escapeHtml(
        String(orderId)
      )}

      <br>


      <b>
        অর্ডারের সময়:
      </b>

      ${formatDate(
        order.created_at
      )}

      <br>


      <b>
        অর্ডার তারিখ:
      </b>

      ${formatDate(
        order.order_date
      )}

      <br>


      <b>
        ডেলিভারি তারিখ:
      </b>

      ${formatDate(
        order.delivery_date
      )}

      <br><br>


      <b>
        🏪 দোকানের নাম:
      </b>

      ${escapeHtml(
        order.shop
      )}

      <br>


      <b>
        📍 ঠিকানা:
      </b>

      ${escapeHtml(
        order.address
      )}

      <br>


      <b>
        📞 মোবাইল:
      </b>

      ${escapeHtml(
        order.mobile
      )}

      <br>


      <b>
        👤 প্রতিনিধি:
      </b>

      ${escapeHtml(
        order.representative
      )}

    </div>


    ${
      safeMobile
      ?
      `
      <a
        class="call"
        href="tel:${safeMobile}"
      >
        📞 সরাসরি কল করুন
      </a>
      `
      :
      ""
    }


    <h4>
      🛒 পণ্যসমূহ
    </h4>


    ${productHtml}


    <div class="total">

      মোট অর্ডার:
      ৳${formatMoney(
        order.total
      )}

    </div>


    ${
      order.note
      ?
      `
      <div class="item">

        <b>
          📝 মন্তব্য:
        </b>

        <br>

        ${escapeHtml(
          order.note
        )}

      </div>
      `
      :
      ""
    }


    <div class="status">

      <label>
        📌 অর্ডারের Status
      </label>


      <select
        onchange="
          updateOrderStatus(
            '${escapeHtml(
              String(orderId)
            )}',
            this.value
          )
        "
      >

        <option
          value="pending"
          ${
            currentStatus === "pending"
            ? "selected"
            : ""
          }
        >
          🆕 নতুন
        </option>


        <option
          value="processing"
          ${
            currentStatus === "processing"
            ? "selected"
            : ""
          }
        >
          🔄 প্রসেসিং
        </option>


        <option
          value="delivery"
          ${
            currentStatus === "delivery"
            ? "selected"
            : ""
          }
        >
          🚚 ডেলিভারি
        </option>


        <option
          value="completed"
          ${
            currentStatus === "completed"
            ? "selected"
            : ""
          }
        >
          ✅ সম্পন্ন

        <option
          value="rejected"

            currentStatus === "rejected"
            ? "selected"
            : ""

        >
          ❌ বাতিল
        </option>

      </select>


      <div class="small">

        বর্তমান:
        <span class="
          badge
          ${statusClass(
            currentStatus
          )}
        ">
          ${statusText(
            currentStatus
          )}
        </span>

      </div>

    </div>


    <button
      class="print"
      onclick="
        printOrder(
          '${escapeHtml(
            String(orderId)
          )}'
        )
      "
    >
      🖨️ মেমো প্রিন্ট করুন

    <button

  `;


  ordersBox.appendChild(
    div
  );

}

// =====================================================

  orderId,
  newStatus
){

      error
    } =
    await supabaseClient
      .from("orders")
      .update({

        updated_at:
          new Date().toISOString()

        orderId

      error.message
    );

}

// =====================================================
// USER MESSAGE
// =====================================================

function showUserMessage(
  text,
  type
){

  const box =
  document.getElementById(
    "userMessage"
  );


  box.textContent =
  text;


  box.className =
  "message " +
  (
    type === "success"
    ?
    "success-message"
    :
    "error-message"
  );


  box.style.display =
  "block";

}


// =====================================================
// LOAD USERS
// =====================================================

async function loadUsers(){

  const box =
  document.getElementById(
    "usersBox"
  );


  box.innerHTML = `

    <div class="card loading">
      ইউজার লোড হচ্ছে...
    </div>

  `;


  try{

    const {
      data,
      error
    } =
    await supabaseClient.rpc(
      "get_pending_users"
    );


    if(error){

      throw error;

    }


    const users =
    data || [];


    const pendingUsers =
    users.filter(
      user =>
      user.status ===
      "pending"
    );


    document.getElementById(
      "pendingCount"
    ).textContent =
    pendingUsers.length;


    if(
      users.length === 0
    ){

      box.innerHTML = `

        <div class="card empty">

          <div style="font-size:40px;">
            🎉
          </div>

          <h3>
            কোনো User পাওয়া যায়নি
          </h3>

        </div>

      `;

      return;

    }


    box.innerHTML =
    "";


    users.forEach(
      user => {

        const div =
        document.createElement(
          "div"
        );


        div.className =
        "user-card";


        let statusClassName =
        "pending";


        let statusTextValue =
        "⏳ Pending";


        if(
          user.status ===
          "approved"
        ){

          statusClassName =
          "approved";

          statusTextValue =
          "✅ Approved";

        }


        if(
          user.status ===
          "rejected"
        ){

          statusClassName =
          "rejected";

          statusTextValue =
          "❌ Rejected";

        }


        div.innerHTML = `

          <h3>
            👤
            ${escapeHtml(
              user.username || "-"
            )}
          </h3>

          <div class="user-info">

            <b>Email:</b>
            ${escapeHtml(
              user.email || "-"
            )}

            <br>

            <b>Account:</b>
            ${formatDate(
              user.created_at
            )}

            <br>

            <b>Status:</b>

            <span class="
              user-status
              ${statusClassName}
            ">
              ${statusTextValue}
            </span>

          </div>


          ${
            user.status === "pending"
            ?
            `

            <div class="user-actions">

              <button
                class="approve-btn"
                onclick="
                  approveUser(
                    '${escapeHtml(
                      user.id
                    )}',
                    this
                  )
                "
              >
                ✅ Approve
              </button>


              <button
                class="reject-btn"
                onclick="
                  rejectUser(
                    '${escapeHtml(
                      user.id
                    )}',
                    this
                  )
                "
              >
                ❌ Reject
              </button>

            </div>

            `
            :
            user.status === "approved"
            ?
            `

            <div class="user-actions">

              <button
                class="reject-btn"
                onclick="
                  rejectUser(
                    '${escapeHtml(
                      user.id
                    )}',
                    this
                  )
                "
              >
                ❌ Reject
              </button>

            </div>

            `
            :
            `

            <div class="user-actions">

              <button
                class="approve-btn"
                onclick="
                  approveUser(
                    '${escapeHtml(
                      user.id
                    )}',
                    this
                  )
                "
              >
                ✅ Approve
              </button>

            </div>

            `
          }

        `;


        box.appendChild(
          div
        );

      }
    );

  }
  catch(error){

    console.error(
      "USER LOAD ERROR:",
      error
    );


    box.innerHTML = `

      <div class="card error">

        <b>
          ইউজার লোড করা যায়নি
        </b>

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


// =====================================================
// APPROVE USER
// =====================================================

async function approveUser(
  userId,
  button
){

  if(
    !confirm(
      "এই User-কে Approve করতে চান?"
    )
  ){

    return;

  }


  button.disabled =
  true;


  try{

    const {
      error
    } =
    await supabaseClient.rpc(
      "approve_user",
      {
        target_user_id:
        userId
      }
    );


    if(error){

      throw error;

    }


    showUserMessage(
      "User সফলভাবে Approved হয়েছে।",
      "success"
    );


    await loadUsers();

  }
  catch(error){

    console.error(error);

    showUserMessage(
      "Approve করা যায়নি: " +
      error.message,
      "error"
    );


    button.disabled =
    false;

  }

}


// =====================================================
// REJECT USER
// =====================================================

async function rejectUser(
  userId,
  button
){

  if(
    !confirm(
      "এই User-কে Reject করতে চান?"
    )
  ){

    return;

  }


  button.disabled =
  true;


  try{

    const {
      error
    } =
    await supabaseClient.rpc(
      "reject_user",
      {
        target_user_id:
        userId
      }
    );


    if(error){

      throw error;

    }


    showUserMessage(
      "User সফলভাবে Rejected হয়েছে।",
      "success"
    );


    await loadUsers();

  }
  catch(error){

    console.error(error);

    showUserMessage(
      "Reject করা যায়নি: " +
      error.message,
      "error"
    );


    button.disabled =
    false;

  }

}


// =====================================================
// INITIALIZE
// =====================================================

async function initialize(){

  const isAdmin =
  await checkAdmin();


  if(!isAdmin){

    return;

  }


  showOrders();


  await loadOrders();


  await loadUsers();

}


// START

initialize();
