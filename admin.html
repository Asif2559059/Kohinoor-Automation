// ======================================================

async function checkAdmin(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    window.location.href =
    "login.html";

    return false;
  }


  // Email check
  if(
    !session.user.email ||
    session.user.email.toLowerCase()
      !== ADMIN_EMAIL.toLowerCase()
  ){

    await supabaseClient.auth.signOut();

    alert(
      "শুধুমাত্র Admin এই পেজে প্রবেশ করতে পারবেন।"
    );

    window.location.href =
    "login.html";

    return false;
  }


  // app_admins table check
  const {
    data,
    error
  } =
  await supabaseClient
    .from("app_admins")
    .select("user_id")
    .eq("user_id",session.user.id)
    .maybeSingle();


  if(
    error ||
    !data
  ){

    await supabaseClient.auth.signOut();

    alert(
      "এই Account-এ Admin permission নেই।"
    );

    window.location.href =
    "login.html";

    return false;
  }


  document.getElementById(
    "adminContent"
  ).style.display =
  "block";


  return true;
}

    const users =

    // Pending count

    users.filter(

      user.status === "pending"

    pendingUsers.length;


    if(users.length === 0){

    box.innerHTML = "";

        const date =

// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// ======================================================
// ORDER STATUS
// ======================================================

function formatDate(value){

  if(!value) return "";


  let match =
  String(value).match(
    /Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/
  );


  if(match){

    const year =
    Number(match[1]);

    const month =
    Number(match[2]) + 1;

    const day =
    Number(match[3]);

    const hour =
    Number(match[4]);

    const minute =
    Number(match[5]);


    const dd =
    String(day).padStart(
      2,"0"
    );

    const mm =
    String(month).padStart(
      2,"0"
    );

    const hh =
    String(hour).padStart(
      2,"0"
    );

    const min =
    String(minute).padStart(
      2,"0"
    );


    return `
      ${dd}/${mm}/${year}
      ${hh}:${min}
    `;

  }


  return value;

}


function getStatuses(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STATUS_KEY
      ) || "{}"
    );

  }
  catch(e){

    return {};

  }

}


function changeStatus(
  orderNumber,
  value
){

  const statuses =
  getStatuses();


  statuses[orderNumber] =
  value;


  localStorage.setItem(
    STATUS_KEY,
    JSON.stringify(statuses)
  );

}

async function loadOrders(){

  const status =
  document.getElementById(
    "status"
  );


  const ordersBox =
  document.getElementById(
    "ordersBox"
  );


  status.textContent =
  "অর্ডার লোড হচ্ছে...";


  ordersBox.innerHTML =
  "";


  try{

    const url =
      "https://docs.google.com/spreadsheets/d/" +
      SHEET_ID +
      "/gviz/tq?tqx=out:json&sheet=" +
      encodeURIComponent(
        SHEET_NAME
      );


    const response =
    await fetch(url);


    if(!response.ok){

      throw new Error(
        "Google Sheet খোলা যাচ্ছে না"
      );

    }


    const text =
    await response.text();


    const start =
    text.indexOf("{");


    const end =
    text.lastIndexOf("}");


    if(
      start === -1 ||
      end === -1
    ){

      throw new Error(
        "Sheet data পাওয়া যায়নি"
      );

    }


    const data =
    JSON.parse(
      text.substring(
        start,
        end + 1
      )
    );


    const rows =
    data.table.rows || [];


    if(rows.length === 0){

      status.textContent =
      "কোনো অর্ডার পাওয়া যায়নি।";


      ordersBox.innerHTML =
      `
      <div class="card empty">
        এখনও কোনো অর্ডার নেই।
      </div>
      `;

      return;

    }


    status.textContent =
    rows.length +
    " টি অর্ডার পাওয়া গেছে";


    const statuses =
    getStatuses();


    rows.reverse().forEach(
      (row,index)=>{

        const c =
        row.c || [];


        function val(n){

          return c[n] &&
            c[n].v != null
            ? c[n].v
            : "";

        }


        const timestamp =
        val(0);

        const shop =
        val(1);

        const customer =
        val(2);

        const mobile =
        val(3);

        const address =
        val(4);

        const product =
        val(5);

        const quantity =
        val(6);

        const note =
        val(7);


        const orderNumber =
        rows.length - index;


        const currentStatus =
        statuses[orderNumber] ||
        "নতুন";


        const div =
        document.createElement(
          "div"
        );


        div.className =
        "order";


        div.id =
        "order_" +
        orderNumber;


        div.dataset.order =
        orderNumber;


        const safeMobile =
        String(mobile)
          .replace(
            /[^0-9+]/g,
            ""
          );


        div.innerHTML = `

<h3>
অর্ডার #${orderNumber}
</h3>


<div class="memoContent">

<b>তারিখ:</b>
${formatDate(timestamp)}

<br>

<b>দোকানের নাম:</b>
${escapeHtml(shop)}

<br>

<b>ক্রেতার নাম:</b>
${escapeHtml(customer)}

<br>

<b>মোবাইল:</b>
${escapeHtml(mobile)}

<br>

<b>ঠিকানা:</b>
${escapeHtml(address)}


<div class="item">

<b>পণ্য:</b>
${escapeHtml(product)}

<br>

<b>পরিমাণ:</b>
${escapeHtml(quantity)}

</div>


${
  note
  ?
  `
  <p>
  <b>মন্তব্য:</b>
  ${escapeHtml(note)}
  </p>
  `
  :
  ""
}

</div>


${
  safeMobile
  ?
  `
  <a
    class="call"
    href="tel:${safeMobile}"
  >
    📞 সরাসরি কল করুন
  </a>
  `
  :
  ""
}


<div class="status">

<b>
অর্ডারের Status:
</b>


<select
  onchange="
    changeStatus(
      ${orderNumber},
      this.value
    )
  "
>

<option
  value="নতুন"
  ${
    currentStatus === "নতুন"
    ? "selected"
    : ""
  }
>
🆕 নতুন
</option>


<option
  value="প্রসেসিং"
  ${
    currentStatus === "প্রসেসিং"
    ? "selected"
    : ""
  }
>
🔄 প্রসেসিং
</option>


<option
  value="ডেলিভারি"
  ${
    currentStatus === "ডেলিভারি"
    ? "selected"
    : ""
  }
>
🚚 ডেলিভারি
</option>


<option
  value="সম্পন্ন"
  ${
    currentStatus === "সম্পন্ন"
    ? "selected"
    : ""
  }
>
✅ সম্পন্ন
</option>

</select>


<div class="small">
Status এই Admin ফোনে সংরক্ষিত হবে।
</div>

</div>


<button
  class="print"
  onclick="
    printOrder(
      'order_${orderNumber}'
    )
  "
>
🖨️ মেমো প্রিন্ট করুন
</button>

`;


        ordersBox.appendChild(
          div
        );

      }
    );


  }
  catch(error){

    console.error(error);


    status.textContent =
    "❌ অর্ডার লোড করা যায়নি";


    ordersBox.innerHTML =
    `
    <div class="card">

      <b>
      সমস্যা হয়েছে:
      </b>

      <br>

      ${escapeHtml(
        error.message
      )}

    </div>
    `;

  }

}


// ======================================================
// INITIALIZE
// ======================================================

async function initialize(){

  const isAdmin =
  await checkAdmin();


  if(!isAdmin){
    return;
  }


  // প্রথমে Order section
  showOrders();


  // Pending user count
  await loadUsers();


  // Order load
  await loadOrders();

}


initialize();

</script>


</body>
</html>
