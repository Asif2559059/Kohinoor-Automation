<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - Kohinoor Automation</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:linear-gradient(135deg,#0b6b45,#16a085);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
  text-align:center;
  color:#0b6b45;
  margin-bottom:25px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  margin-top:22px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#0b6b45;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  text-align:center;
  line-height:1.5;
}

.error{
  background:#ffe5e5;
  color:#b00020;
}

.success{
  background:#e5f8ed;
  color:#087443;
}

.warning{
  background:#fff4d6;
  color:#8a6200;
}

.links{
  text-align:center;
  margin-top:20px;
}

.links a{
  color:#0b6b45;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

  <h2>🔐 Kohinoor Automation</h2>

  <label>ইমেইল</label>
  <input
    type="email"
    id="email"
    placeholder="আপনার ইমেইল"
    autocomplete="email"
  >

  <label>পাসওয়ার্ড</label>
  <input
    type="password"
    id="password"
    placeholder="পাসওয়ার্ড"
    autocomplete="current-password"
  >

  <button id="loginBtn" onclick="login()">
    লগইন
  </button>

  <div id="message" class="message"></div>

  <div class="links">
    <a href="signup.html">নতুন অ্যাকাউন্ট তৈরি করুন</a>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://utzkpsohkoiawvuupgeb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";

const ADMIN_EMAIL =
  "mdyeamin10288@gmail.com";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


// ========================================
// MESSAGE
// ========================================

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className =
    "message " + type;

  box.style.display = "block";
}


function hideMessage(){

  const box =
    document.getElementById("message");

  box.style.display = "none";
}


// ========================================
// BUTTON
// ========================================

function setLoginButtonLoading(loading){

  const btn =
    document.getElementById("loginBtn");

  btn.disabled = loading;

  btn.textContent =
    loading ? "যাচাই হচ্ছে..." : "লগইন";
}


// ========================================
// LOGIN
// ========================================

async function login(){

  const email =
    document.getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("password")
      .value;

  if(!email || !password){

    showMessage(
      "ইমেইল ও পাসওয়ার্ড দিন।",
      "error"
    );

    return;
  }

  hideMessage();

  setLoginButtonLoading(true);

  try{

    // ====================================
    // LOGIN WITH SUPABASE
    // ====================================

    const {
      data,
      error
    } =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });


    if(error){

      console.error(
        "LOGIN ERROR:",
        error
      );

      let message =
        error.message || "লগইন করা যায়নি।";

      // Email confirmation না হলে
      if(
        message.toLowerCase().includes(
          "email not confirmed"
        )
      ){

        message =
          "আপনার Email এখনো Confirm করা হয়নি। Email থেকে Confirmation Link-এ ক্লিক করুন।";
      }

      showMessage(
        "❌ " + message,
        "error"
      );

      setLoginButtonLoading(false);

      return;
    }


    const user = data?.user;


    if(!user){

      showMessage(
        "User পাওয়া যায়নি। আবার চেষ্টা করুন।",
        "error"
      );

      setLoginButtonLoading(false);

      return;
    }


    console.log(
      "LOGIN USER:",
      user
    );


    // ====================================
    // ADMIN CHECK
    // ====================================

    if(
      user.email &&
      user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ){

      localStorage.setItem(
        "kohinoor_user_profile",
        JSON.stringify({
          id:user.id,
          email:user.email,
          username:"Admin",
          status:"approved"
        })
      );

      showMessage(
        "✅ অ্যাডমিন হিসেবে লগইন সফল।",
        "success"
      );

      setTimeout(function(){

        window.location.replace(
          "admin.html"
        );

      },500);

      return;
    }


    // ====================================
    // USER PROFILE
    // ====================================

    let profile = null;


    const {
      data:profileData,
      error:profileError
    } =
    await supabaseClient
      .from("user_profiles")
      .select(
        "id,username,email,status,created_at,avatar_url"
      )
      .eq("id",user.id)
      .maybeSingle();


    profile = profileData;


    console.log(
      "PROFILE:",
      profile
    );

    console.log(
      "PROFILE ERROR:",
      profileError
    );


    // ====================================
    // PROFILE ERROR
    // ====================================

    if(profileError){

      console.error(
        "PROFILE LOAD ERROR:",
        profileError
      );

      /*
       IMPORTANT:
       এখানে আর সঙ্গে সঙ্গে signOut করা হচ্ছে না।
       কারণ RLS বা temporary database error হলে
       account অযথা logout হয়ে যাচ্ছিল।
      */

      showMessage(
        "⚠️ Account পাওয়া গেছে, কিন্তু User Profile লোড করা যাচ্ছে না। কিছুক্ষণ পরে আবার চেষ্টা করুন।",
        "error"
      );

      setLoginButtonLoading(false);

      return;
    }


    // ====================================
    // PROFILE NOT FOUND
    // ====================================

    if(!profile){

      /*
       User account আছে কিন্তু profile নেই।
       এই অবস্থায় logout না করে পরিষ্কার message দেখানো হবে।
      */

      showMessage(
        "⚠️ আপনার User Profile পাওয়া যায়নি। Signup সম্পূর্ণ হয়েছে কিনা যাচাই করুন।",
        "error"
      );

      setLoginButtonLoading(false);

      return;
    }


    // ====================================
    // STATUS
    // ====================================

    const status =
      String(
        profile.status || ""
      )
      .trim()
      .toLowerCase();


    // ====================================
    // PENDING
    // ====================================

    if(status === "pending"){

      showMessage(
        "⏳ আপনার Account এখনো Admin Approval-এর অপেক্ষায় আছে। Approval হওয়ার পর Login করতে পারবেন।",
        "warning"
      );

      /*
       এখানে signOut করা হচ্ছে না।
       Session ঠিক থাকবে।
      */

      setLoginButtonLoading(false);

      return;
    }


    // ====================================
    // REJECTED
    // ====================================

    if(status === "rejected"){

      showMessage(
        "❌ আপনার Account Admin কর্তৃক Reject করা হয়েছে।",
        "error"
      );

      setLoginButtonLoading(false);

      return;
    }


    // ====================================
    // APPROVED
    // ====================================

    if(status === "approved"){

      localStorage.setItem(
        "kohinoor_user_profile",
        JSON.stringify(profile)
      );


      showMessage(
        "✅ Login সফল। Dashboard-এ প্রবেশ করা হচ্ছে...",
        "success"
      );


      setTimeout(function(){

        window.location.replace(
          "index.html"
        );

      },500);

      return;
    }


    // ====================================
    // EMPTY / UNKNOWN STATUS
    // ====================================

    /*
     যদি Signup থেকে status না আসে,
     তাহলে account-কে pending হিসেবে
     treat করা হবে।
    */

    showMessage(
      "⏳ আপনার Account Approval-এর অপেক্ষায় আছে। Admin Approval হওয়ার পর Dashboard-এ প্রবেশ করা যাবে।",
      "warning"
    );

    setLoginButtonLoading(false);

  }
  catch(error){

    console.error(
      "UNEXPECTED LOGIN ERROR:",
      error
    );

    showMessage(
      "❌ Login করার সময় সমস্যা হয়েছে: " +
      (error.message || "Unknown error"),
      "error"
    );

    setLoginButtonLoading(false);
  }

}


// ========================================
// ENTER KEY LOGIN
// ========================================

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        login();

      }

    }
  );


// ========================================
// CHECK EXISTING SESSION
// ========================================

async function checkExistingSession(){

  try{

    const {
      data
    } =
    await supabaseClient
      .auth
      .getSession();

    const session =
      data?.session;


    if(!session){

      return;
    }


    const user =
      session.user;


    if(!user){

      return;
    }


    /*
     Existing session থাকলে সরাসরি
     Dashboard-এ পাঠানো হবে না।

     কারণ status আবার check করতে হবে।
    */

    if(
      user.email &&
      user.email.toLowerCase() ===
      ADMIN_EMAIL.toLowerCase()
    ){

      window.location.replace(
        "admin.html"
      );

      return;
    }


    const {
      data:profile,
      error
    } =
    await supabaseClient
      .from("user_profiles")
      .select(
        "id,username,email,status,created_at,avatar_url"
      )
      .eq("id",user.id)
      .maybeSingle();


    if(error || !profile){

      return;
    }


    const status =
      String(
        profile.status || ""
      )
      .trim()
      .toLowerCase();


    if(status === "approved"){

      localStorage.setItem(
        "kohinoor_user_profile",
        JSON.stringify(profile)
      );

      window.location.replace(
        "index.html"
      );

    }

  }
  catch(error){

    console.error(
      "SESSION CHECK ERROR:",
      error
    );

  }

}


// ========================================
// START
// ========================================

document.addEventListener(
  "DOMContentLoaded",
  function(){

    checkExistingSession();

  }
);

</script>

</body>
</html>
