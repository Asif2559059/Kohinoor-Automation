<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন User Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center;
      align-items: center; padding: 20px; font-family: Arial, sans-serif;
      background: #f3f6f5;
    }
    .signup-box {
      width: 100%; max-width: 400px; background: #fff; padding: 28px 24px;
      border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,.12);
    }
    h2 { margin: 0 0 8px; text-align: center; color: #0b6b45; }
    .subtitle { margin: 0 0 22px; text-align: center; color: #666; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; color: #333; }
    input {
      width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 16px; outline: none;
    }
    input:focus { border-color: #0b6b45; }
    button {
      width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 8px;
      background: #0b6b45; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #message {
      display: none; margin-top: 16px; padding: 12px; border-radius: 8px;
      text-align: center; font-size: 14px; line-height: 1.5;
    }
    .success { display: block !important; background: #e8f7ee; color: #146c3a; }
    .error { display: block !important; background: #fdecec; color: #a12626; }
    .login-link { margin-top: 18px; text-align: center; font-size: 14px; color: #555; }
    .login-link a { color: #0b6b45; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>নতুন User Account</h2>
    <p class="subtitle">আপনার নতুন অ্যাকাউন্ট তৈরি করুন</p>

    <form id="signupForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="আপনার Email লিখুন" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="কমপক্ষে ৬ অক্ষর" autocomplete="new-password" minlength="6" required>

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Password আবার লিখুন" autocomplete="new-password" minlength="6" required>

      <button type="submit" id="signupButton">Sign Up</button>
      <div id="message"></div>
    </form>

    <div class="login-link">
      আগে থেকেই Account আছে? <a href="login.html">Login করুন</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://utzkpsohkoiawvuupgeb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";

    // Supabase Dashboard > Authentication > URL Configuration-এ
    // এই URL-টিও Redirect URL হিসেবে যোগ করতে হবে।
    const EMAIL_REDIRECT_URL =
      "https://Asif2559059.github.io/Kohinoor-Automation/login.html";

    const form = document.getElementById("signupForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const signupButton = document.getElementById("signupButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function translateError(errorMessage) {
      const text = String(errorMessage || "").toLowerCase();
      if (text.includes("user already registered")) return "এই Email দিয়ে আগে থেকেই Account আছে। Login করুন।";
      if (text.includes("password should be at least")) return "Password কমপক্ষে ৬ অক্ষরের হতে হবে।";
      if (text.includes("invalid email")) return "সঠিক Email address দিন।";
      if (text.includes("email rate limit") || text.includes("rate limit")) return "Email পাঠানোর সীমা অতিক্রম হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
      return "Sign Up করা যায়নি: " + errorMessage;
    }

    let supabaseClient = null;

    if (!window.supabase) {
      showMessage("Supabase library load হয়নি। Internet connection পরীক্ষা করুন।", "error");
    } else {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (error) {
        showMessage("Supabase configuration ভুল হয়েছে।", "error");
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!supabaseClient) {
        showMessage("Supabase configuration ঠিক করা হয়নি।", "error");
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!email) return showMessage("Email দিন।", "error");
      if (password.length < 6) return showMessage("Password কমপক্ষে ৬ অক্ষরের হতে হবে।", "error");
      if (password !== confirmPassword) return showMessage("দুইটি Password একই নয়।", "error");

      signupButton.disabled = true;
      signupButton.textContent = "Account তৈরি হচ্ছে...";
      message.className = "";
      message.textContent = "";

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: EMAIL_REDIRECT_URL
          }
        });

        if (error) {
          showMessage(translateError(error.message), "error");
          return;
        }

        if (data.user && !data.session) {
          showMessage(
            "Account তৈরি হয়েছে। আপনার Email inbox-এ confirmation link পাঠানো হয়েছে। Email confirm করার পর Login করুন।",
            "success"
          );
          form.reset();
          return;
        }

        if (data.user && data.session) {
          showMessage("Account সফলভাবে তৈরি হয়েছে। Login page-এ নেওয়া হচ্ছে...", "success");
          setTimeout(() => { window.location.href = EMAIL_REDIRECT_URL; }, 1200);
          return;
        }

        showMessage("Account তৈরি করা যায়নি। আবার চেষ্টা করুন।", "error");
      } catch (error) {
        showMessage("একটি অপ্রত্যাশিত সমস্যা হয়েছে: " + (error.message || error), "error");
      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "Sign Up";
      }
    });
  </script>
</body>
</html>
