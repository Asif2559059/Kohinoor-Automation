<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kohinoor Automation - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #15803d;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748b;
    }

    .links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 18px;
    }

    .forgot a {
      color: #2563eb;
      font-size: 13px;
      text-decoration: none;
    }

    .forgot a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">Kohinoor Automation</div>

    <div class="subtitle">
      Login to your account
    </div>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>


      <div class="forgot">

        <a href="#" id="forgotPassword">
          Forgot Password?
        </a>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>


    <div id="message" class="message"></div>


    <div class="links">

      Don't have an account?

      <a href="signup.html">
        Sign Up
      </a>

    </div>

  </div>


  <script>

    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================

    const SUPABASE_URL =
      "https://utzkpsohkoiawvuupgeb.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_PJj7uWbW3pd3VQvSI0jNyA_xY3CFKAt";


    // ============================================
    // ADMIN EMAIL
    // ============================================

    const ADMIN_EMAIL =
      "mdyeamin10288@gmail.com";


    // ============================================
    // DASHBOARD
    // ============================================

    const DASHBOARD_URL =
      "index.html";


    // ============================================
    // ADMIN PAGE
    // ============================================

    const ADMIN_URL =
      "admin.html";


    // ============================================
    // SUPABASE CLIENT
    // ============================================

    const { createClient } = supabase;

    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ============================================
    // ELEMENTS
    // ============================================

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");

    const forgotPassword =
      document.getElementById("forgotPassword");


    // ============================================
    // SHOW MESSAGE
    // ============================================

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    // ============================================
    // CHECK USER PROFILE
    // ============================================

    async function checkUserProfile(user) {

      const { data: profile, error } =
        await supabaseClient
          .from("user_profiles")
          .select(
            "id, username, email, status, created_at"
          )
          .eq("id", user.id)
          .maybeSingle();


      if (error) {

        console.error(
          "Profile error:",
          error
        );

        return {
          success: false,
          error: error.message
        };

      }


      if (!profile) {

        return {
          success: false,
          error: "USER_PROFILE_NOT_FOUND"
        };

      }


      return {
        success: true,
        profile: profile
      };

    }


    // ============================================
    // LOGIN
    // ============================================

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Email এবং Password দিন।",
            "error"
          );

          return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Checking...";

        message.className =
          "message";


        try {

          // ======================================
          // SUPABASE LOGIN
          // ======================================

          const { data, error } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          // ======================================
          // LOGIN ERROR
          // ======================================

          if (error) {

            console.error(
              "Login error:",
              error
            );

            showMessage(
              "Login failed: " +
              error.message,
              "error"
            );

            return;

          }


          if (!data || !data.user) {

            showMessage(
              "Login করা যায়নি। আবার চেষ্টা করুন।",
              "error"
            );

            return;

          }


          const user =
            data.user;


          // ======================================
          // ADMIN CHECK
          // ======================================

          if (
            user.email &&
            user.email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
          ) {

            showMessage(
              "Admin Login successful! Redirecting...",
              "success"
            );


            setTimeout(
              function() {

                window.location.href =
                  ADMIN_URL;

              },
              500
            );


            return;

          }


          // ======================================
          // USER PROFILE CHECK
          // ======================================

          const result =
            await checkUserProfile(user);


          if (!result.success) {

            console.error(
              "Profile check failed:",
              result.error
            );


            await supabaseClient.auth.signOut();


            showMessage(
              "আপনার User Profile পাওয়া যায়নি। Admin-এর সাথে যোগাযোগ করুন।",
              "error"
            );


            return;

          }


          const profile =
            result.profile;


          // ======================================
          // PENDING
          // ======================================

          if (
            profile.status === "pending"
          ) {

            await supabaseClient.auth.signOut();


            showMessage(

              "আপনার Account এখনো Admin Approval-এর অপেক্ষায় আছে। Admin Approve করার পর আবার Login করুন।",

              "error"

            );


            return;

          }


          // ======================================
          // REJECTED
          // ======================================

          if (
            profile.status === "rejected"
          ) {

            await supabaseClient.auth.signOut();


            showMessage(

              "দুঃখিত, আপনার Account Admin Reject করেছেন। Admin-এর সাথে যোগাযোগ করুন।",

              "error"

            );


            return;

          }


          // ======================================
          // APPROVED
          // ======================================

          if (
            profile.status === "approved"
          ) {

            /*
             * Profile information localStorage-এ
             * রাখা হচ্ছে যাতে Dashboard-এ
             * Username/Email দেখানো যায়।
             */

            localStorage.setItem(
              "kohinoor_user_profile",
              JSON.stringify(profile)
            );


            showMessage(

              "Login successful! Welcome " +
              profile.username +
              ".",

              "success"

            );


            setTimeout(
              function() {

                window.location.href =
                  DASHBOARD_URL;

              },
              700
            );


            return;

          }


          // ======================================
          // UNKNOWN STATUS
          // ======================================

          await supabaseClient.auth.signOut();


          showMessage(

            "আপনার Account Status সঠিক নয়। Admin-এর সাথে যোগাযোগ করুন।",

            "error"

          );


        } catch (err) {

          console.error(
            "Login exception:",
            err
          );


          showMessage(

            "একটি অপ্রত্যাশিত সমস্যা হয়েছে। আবার চেষ্টা করুন।",

            "error"

          );

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

        }

      }
    );


    // ============================================
    // FORGOT PASSWORD
    // ============================================

    forgotPassword.addEventListener(
      "click",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "আগে আপনার Email লিখুন।",
            "error"
          );

          emailInput.focus();

          return;

        }


        try {

          const { error } =
            await supabaseClient.auth
              .resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    "https://Asif2559059.github.io/Kohinoor-Automation/signin.html"
                }
              );


          if (error) {

            showMessage(
              "Password reset failed: " +
              error.message,
              "error"
            );

            return;

          }


          showMessage(

            "Password reset link আপনার Email-এ পাঠানো হয়েছে।",

            "success"

          );


        } catch (err) {

          console.error(err);

          showMessage(

            "Password reset email পাঠানো যায়নি।",

            "error"

          );

        }

      }
    );


    // ============================================
    // CHECK EXISTING SESSION
    // ============================================

    async function checkSession() {

      const {
        data
      } =
        await supabaseClient.auth.getSession();


      if (
        data &&
        data.session &&
        data.session.user
      ) {

        const user =
          data.session.user;


        // ========================================
        // ADMIN
        // ========================================

        if (
          user.email &&
          user.email.toLowerCase() ===
          ADMIN_EMAIL.toLowerCase()
        ) {

          window.location.href =
            ADMIN_URL;

          return;

        }


        // ========================================
        // NORMAL USER
        // ========================================

        const result =
          await checkUserProfile(user);


        if (
          result.success &&
          result.profile.status === "approved"
        ) {

          localStorage.setItem(
            "kohinoor_user_profile",
            JSON.stringify(result.profile)
          );


          window.location.href =
            DASHBOARD_URL;


          return;

        }


        // Pending / Rejected / Profile missing
        await supabaseClient.auth.signOut();

      }

    }


    checkSession();

  </script>

</body>
</html>
